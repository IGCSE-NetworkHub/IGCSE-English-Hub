<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IGCSE English Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #1f3c88;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>IGCSE English Hub</h1>

    <p class="subtitle">
        Student Registration
    </p>

    <form id="registrationForm">

        <label for="studentName">Student Name</label>
        <input
            type="text"
            id="studentName"
            placeholder="Enter student's name"
            required
        >

        <label for="parentPhone">Parent / Guardian WhatsApp</label>
        <input
            type="tel"
            id="parentPhone"
            placeholder="Enter WhatsApp number"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            placeholder="Enter email address"
            required
        >

        <label for="grade">Stage / Grade</label>
        <select id="grade" required>
            <option value="">Select your stage</option>
            <option value="Stage 4">Stage 4</option>
            <option value="Stage 5">Stage 5</option>
            <option value="Stage 6">Stage 6</option>
            <option value="Stage 7">Stage 7</option>
            <option value="Stage 8">Stage 8</option>
            <option value="Stage 9">Stage 9</option>
            <option value="IGCSE">IGCSE</option>
        </select>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
