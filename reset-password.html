
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | IGCSE English Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 5px 24px rgba(0,0,0,.09);
        }

        h1 {
            color: #17365d;
            text-align: center;
            margin-top: 0;
        }

        p {
            color: #555;
            line-height: 1.6;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border-radius: 7px;
            font-size: 16px;
        }

        input {
            border: 1px solid #ccd3df;
        }

        button {
            background: #17365d;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Reset Password</h1>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="submitButton">
                Save New Password
            </button>
        </form>

        <p id="message" role="status"></p>
    </div>

    <script>
        const SUPABASE_URL =
            "https://knazqfrjzgkqavnhzjwq.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("resetForm");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                message.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "The passwords do not match.";
                return;
            }

            submitButton.disabled = true;
            message.textContent = "Saving your new password...";

            try {
                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) throw error;

                if (!data.session) {
                    message.textContent =
                        "This reset link is invalid or has expired. Request a new password reset email.";
                    return;
                }

                const { error: updateError } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (updateError) throw updateError;

                message.textContent =
                    "Password updated successfully. You can now return to the login page.";

                form.reset();

            } catch (error) {
                message.textContent =
                    "Unable to reset password: " + error.message;
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
