
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | IGCSE English Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{background:white;width:100%;max-width:430px;padding:32px;border-radius:14px;box-shadow:0 5px 24px rgba(0,0,0,.09)}
h1{text-align:center;color:#17365d}
p{text-align:center;color:#555;line-height:1.6}
input,button{width:100%;padding:13px;margin-top:14px;border-radius:7px;font-size:16px}
input{border:1px solid #ccd3df}
button{background:#17365d;color:white;border:none;cursor:pointer;font-weight:bold}
button:disabled{opacity:.6;cursor:not-allowed}
#message{margin-top:18px;font-weight:bold;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>Reset Password</h1>
<p>Enter your new password below.</p>

<form id="resetForm">
<input type="password" id="newPassword" placeholder="New password" minlength="8" autocomplete="new-password" required>
<input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required>
<button type="submit" id="submitButton">Save New Password</button>
</form>

<p id="message" role="status">Checking your reset link...</p>
</div>

<script>
const SUPABASE_URL = "https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY = "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
        detectSessionInUrl: false,
        persistSession: true,
        autoRefreshToken: true,
        flowType: "pkce"
    }
});

const form = document.getElementById("resetForm");
const message = document.getElementById("message");
const button = document.getElementById("submitButton");

let linkReady = false;

async function prepareReset() {
    try {
        const params = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.substring(1));

        const urlError = params.get("error_description") || hash.get("error_description");
        if (urlError) {
            throw new Error(urlError.replace(/\+/g, " "));
        }

        const code = params.get("code");

        if (code) {
            const { error } = await client.auth.exchangeCodeForSession(code);
            if (error) throw error;
        } else {
            const accessToken = hash.get("access_token");
            const refreshToken = hash.get("refresh_token");

            if (accessToken && refreshToken) {
                const { error } = await client.auth.setSession({
                    access_token: accessToken,
                    refresh_token: refreshToken
                });
                if (error) throw error;
            } else {
                const tokenHash = params.get("token_hash");
                const type = params.get("type");

                if (tokenHash && type === "recovery") {
                    const { error } = await client.auth.verifyOtp({
                        token_hash: tokenHash,
                        type: "recovery"
                    });
                    if (error) throw error;
                }
            }
        }

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        if (!data.session) {
            throw new Error("No valid recovery session was found. Request a new reset email and open its newest link.");
        }

        linkReady = true;
        message.textContent = "Reset link verified. Enter your new password.";
    } catch (error) {
        linkReady = false;
        message.textContent = "Reset link error: " + error.message;
    }
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!linkReady) {
        message.textContent = "The reset link has not been verified. Request a new reset email.";
        return;
    }

    const password = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        message.textContent = "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
    }

    button.disabled = true;
    message.textContent = "Saving your new password...";

    try {
        const { error } = await client.auth.updateUser({ password: password });
        if (error) throw error;

        message.textContent = "Password updated successfully. You can now log in with your new password.";
        form.reset();
        linkReady = false;
    } catch (error) {
        message.textContent = "Unable to reset password: " + error.message;
    } finally {
        button.disabled = false;
    }
});

prepareReset();
</script>
</body>
</html>
