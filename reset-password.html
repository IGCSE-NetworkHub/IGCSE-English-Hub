
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | IGCSE English Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 32px;
            border-radius: 14px;
            box-shadow: 0 5px 24px rgba(0, 0, 0, .09);
        }

        h1 {
            color: #17365d;
            text-align: center;
            margin-top: 0;
        }

        p {
            color: #555;
            line-height: 1.6;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 14px;
            border-radius: 7px;
            font-size: 16px;
        }

        input {
            border: 1px solid #ccd3df;
        }

        button {
            background: #17365d;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .login-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #17365d;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Reset Password</h1>

        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="8"
                autocomplete="new-password"
                required
                disabled
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
                disabled
            >

            <button type="submit" id="submitButton" disabled>
                Save New Password
            </button>
        </form>

        <p id="message" role="status">
            Checking your password reset link...
        </p>

        <a class="login-link" href="login.html">
            Return to Login
        </a>
    </div>

    <script>
        const SUPABASE_URL =
            "https://knazqfrjzgkqavnhzjwq.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY,
            {
                auth: {
                    detectSessionInUrl: false,
                    persistSession: true,
                    autoRefreshToken: true,
                    flowType: "pkce"
                }
            }
        );

        const form = document.getElementById("resetForm");
        const passwordInput = document.getElementById("newPassword");
        const confirmInput = document.getElementById("confirmPassword");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        let recoveryReady = false;

        function setFormEnabled(enabled) {
            passwordInput.disabled = !enabled;
            confirmInput.disabled = !enabled;
            submitButton.disabled = !enabled;
        }

        async function prepareRecoverySession() {
            try {
                const currentUrl = new URL(window.location.href);
                const query = currentUrl.searchParams;
                const hash = new URLSearchParams(
                    currentUrl.hash.replace(/^#/, "")
                );

                const errorDescription =
                    query.get("error_description") ||
                    hash.get("error_description");

                if (errorDescription) {
                    throw new Error(
                        decodeURIComponent(
                            errorDescription.replace(/\+/g, " ")
                        )
                    );
                }

                // Handle a PKCE recovery link containing ?code=...
                const code = query.get("code");

                if (code) {
                    const { error } =
                        await supabaseClient.auth.exchangeCodeForSession(code);

                    if (error) {
                        throw error;
                    }
                } else {
                    // Handle recovery links containing tokens after #
                    const accessToken = hash.get("access_token");
                    const refreshToken = hash.get("refresh_token");

                    if (accessToken && refreshToken) {
                        const { error } =
                            await supabaseClient.auth.setSession({
                                access_token: accessToken,
                                refresh_token: refreshToken
                            });

                        if (error) {
                            throw error;
                        }
                    } else {
                        // Handle a recovery link containing token_hash
                        const tokenHash =
                            query.get("token_hash") ||
                            hash.get("token_hash");

                        const recoveryType =
                            query.get("type") ||
                            hash.get("type");

                        if (tokenHash && recoveryType === "recovery") {
                            const { error } =
                                await supabaseClient.auth.verifyOtp({
                                    token_hash: tokenHash,
                                    type: "recovery"
                                });

                            if (error) {
                                throw error;
                            }
                        }
                    }
                }

                const { data, error } =
                    await supabaseClient.auth.getSession();

                if (error) {
                    throw error;
                }

                if (!data.session) {
                    throw new Error(
                        "No valid recovery session was found. Request a new reset email and open its latest link in this browser."
                    );
                }

                recoveryReady = true;
                setFormEnabled(true);

                message.textContent =
                    "Your link is verified. You can now enter your new password.";

                // Remove recovery tokens from the visible address bar.
                window.history.replaceState(
                    {},
                    document.title,
                    currentUrl.pathname
                );

            } catch (error) {
                recoveryReady = false;
                setFormEnabled(false);

                message.textContent =
                    "Could not verify this reset link: " + error.message +
                    " Please request a new reset email and open the latest link.";
            }
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            if (!recoveryReady) {
                message.textContent =
                    "Your reset link has not been verified. Please request a new one.";
                return;
            }

            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (password.length < 8) {
                message.textContent =
                    "Password must contain at least 8 characters.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent =
                    "The passwords do not match.";
                return;
            }

            setFormEnabled(false);
            message.textContent = "Saving your new password...";

            try {
                const { data: sessionData, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError) {
                    throw sessionError;
                }

                if (!sessionData.session) {
                    throw new Error(
                        "Your recovery session has expired. Request a new reset email."
                    );
                }

                const { error: updateError } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (updateError) {
                    throw updateError;
                }

                recoveryReady = false;
                form.reset();
                setFormEnabled(false);

                message.textContent =
                    "Password updated successfully. You can now return to the login page and sign in with your new password.";

            } catch (error) {
                message.textContent =
                    "Unable to reset password: " + error.message;

                setFormEnabled(recoveryReady);
            }
        });

        prepareRecoverySession();
    </script>
</body>
</html>
