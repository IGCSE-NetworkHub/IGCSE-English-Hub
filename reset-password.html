
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | The Blueprint</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#102a56;color:white;padding:20px 8%;font-size:22px;font-weight:bold}
header span{color:#f4c542}
.container{min-height:85vh;display:flex;justify-content:center;align-items:center;padding:25px}
.card{background:white;width:100%;max-width:450px;padding:32px;border-radius:14px;box-shadow:0 8px 30px #00000012}
h1{text-align:center;color:#102a56;font-size:26px}
p{color:#657084;line-height:1.6;text-align:center}
label{display:block;font-weight:bold;margin:18px 0 8px}
input{width:100%;padding:13px;border:1px solid #ccd4e0;border-radius:7px;font-size:16px}
button{width:100%;padding:14px;margin-top:22px;background:#f4c542;color:#172033;border:0;border-radius:7px;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
#message{display:none;margin-top:18px;padding:12px;border-radius:7px;line-height:1.5;overflow-wrap:anywhere}
a{color:#1f4b91;font-weight:bold}
.note{text-align:center;margin-top:20px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>THE <span>BLUEPRINT</span></header>
<div class="container">
<div class="card">
<h1>Set a New Password</h1>
<p>Enter your new password below.</p>

<div id="status" role="status" aria-live="polite"></div>

<form id="resetForm" class="hidden">
<label for="newPassword">New Password</label>
<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>

<label for="confirmPassword">Confirm New Password</label>
<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>

<button id="saveButton" type="submit">Save New Password</button>
</form>

<div id="message" role="status" aria-live="polite"></div>
<div class="note"><a href="login.html">Return to Login</a></div>
</div>
</div>

<script>
const SUPABASE_URL="https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY="sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{
    detectSessionInUrl:false,
    persistSession:true,
    autoRefreshToken:true,
    flowType:"pkce"
  }
});

const form=document.getElementById("resetForm");
const statusBox=document.getElementById("status");
const messageBox=document.getElementById("message");
const saveButton=document.getElementById("saveButton");

function showMessage(message,success=false){
  messageBox.style.display="block";
  messageBox.style.background=success?"#edf8ef":"#fff0f0";
  messageBox.style.color=success?"#17632a":"#a11";
  messageBox.textContent=message;
}

function showStatus(message){
  statusBox.textContent=message;
  statusBox.style.textAlign="center";
  statusBox.style.padding="14px 0";
}

async function initialise(){
  try{
    const url=new URL(window.location.href);
    const params=url.searchParams;
    const hash=new URLSearchParams(url.hash.slice(1));

    const code=params.get("code");
    const tokenHash=params.get("token_hash");
    const type=params.get("type")||hash.get("type");
    const accessToken=hash.get("access_token");
    const refreshToken=hash.get("refresh_token");

    if(code){
      const {error}=await client.auth.exchangeCodeForSession(code);
      if(error) throw error;
    }else if(tokenHash && type==="recovery"){
      const {error}=await client.auth.verifyOtp({
        token_hash:tokenHash,
        type:"recovery"
      });
      if(error) throw error;
    }else if(accessToken && refreshToken && type==="recovery"){
      const {error}=await client.auth.setSession({
        access_token:accessToken,
        refresh_token:refreshToken
      });
      if(error) throw error;
    }

    const {data,error}=await client.auth.getSession();
    if(error) throw error;

    if(!data.session){
      showStatus("This password reset link is invalid, expired, or has already been used. Please request a new reset email.");
      return;
    }

    form.classList.remove("hidden");
    statusBox.textContent="Your reset link is verified. Choose a new password.";
    statusBox.style.textAlign="center";
    statusBox.style.color="#17632a";

  }catch(error){
    showStatus("Could not verify this reset link. Please request a new password reset email.");
    console.error("Password reset verification error:",error);
  }
}

form.addEventListener("submit",async function(event){
  event.preventDefault();
  messageBox.style.display="none";

  const password=document.getElementById("newPassword").value;
  const confirmation=document.getElementById("confirmPassword").value;

  if(password.length<8){
    showMessage("Your password must contain at least 8 characters.");
    return;
  }

  if(password!==confirmation){
    showMessage("The passwords do not match.");
    return;
  }

  saveButton.disabled=true;
  saveButton.textContent="Saving...";

  try{
    const {data:sessionData,error:sessionError}=await client.auth.getSession();
    if(sessionError) throw sessionError;
    if(!sessionData.session){
      throw new Error("Your reset session has expired. Please request a new reset email.");
    }

    const {error}=await client.auth.updateUser({password:password});
    if(error) throw error;

    await client.auth.signOut();
    form.classList.add("hidden");
    statusBox.textContent="";
    showMessage("Your password has been changed successfully. You can now log in using your new password.",true);

  }catch(error){
    showMessage(error.message||"Unable to update your password. Please try again.");
  }finally{
    saveButton.disabled=false;
    saveButton.textContent="Save New Password";
  }
});

initialise();
</script>
</body>
</html>
