<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Course - IGCSE English Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin: 10px 0 0;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto 60px;
        }

        .welcome-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .welcome-box h2 {
            margin: 0 0 10px;
            color: #1e3a8a;
        }

        .welcome-box p {
            margin: 0;
            color: #64748b;
        }

        .section-title {
            text-align: center;
            margin: 40px 0 25px;
        }

        .section-title h2 {
            margin: 0 0 8px;
            color: #0f172a;
        }

        .section-title p {
            margin: 0;
            color: #64748b;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .card h3 {
            color: #1e3a8a;
            margin: 8px 0;
        }

        .card p {
            color: #64748b;
            line-height: 1.5;
        }

        .button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .button:hover {
            background: #312e81;
        }

        /* STORY */

        .story-section {
            margin-top: 55px;
        }

        .story-header {
            background: linear-gradient(135deg, #312e81, #1e40af);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .story-header .icon {
            font-size: 55px;
        }

        .story-header h2 {
            margin: 10px 0;
            font-size: 28px;
        }

        .story-header p {
            margin: 0;
            opacity: 0.9;
        }

        .chapter-card {
            background: white;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            transition: 0.25s;
        }

        .chapter-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
        }

        .chapter-icon {
            font-size: 52px;
            margin-bottom: 12px;
        }

        .chapter-number {
            font-size: 20px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .chapter-name {
            font-size: 17px;
            font-weight: bold;
            color: #334155;
            line-height: 1.4;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .message {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            color: #64748b;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        footer {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            .container {
                width: 94%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>📚 My Course</h1>

    <p>IGCSE English Hub</p>

</header>


<div class="container">


    <!-- STUDENT WELCOME -->

    <div class="welcome-box">

        <h2 id="welcome">
            Welcome!
        </h2>

        <p id="yearTitle">
            Loading your course...
        </p>

    </div>


    <!-- COURSE UNITS -->

    <div class="section-title">

        <h2>📘 Course Units</h2>

        <p>
            Your English course units
        </p>

    </div>


    <div id="unitsContainer" class="cards">

        <div class="loading">
            Loading units...
        </div>

    </div>


    <!-- STORY -->

    <div class="story-section">


        <div class="story-header">

            <div class="icon">
                📖
            </div>

            <h2>
                The Story
            </h2>

            <p>
                Read the story chapter by chapter.
            </p>

        </div>


        <div id="storyContainer" class="cards">

            <div class="loading">
                Loading chapters...
            </div>

        </div>


    </div>


</div>


<footer>

    © 2026 IGCSE English Hub — All Rights Reserved

</footer>



<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://knazqfrjzgkqavnhzjwq.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   CHAPTER NAMES
========================================= */

const chapterNames = {

    1: "Shipwrecked and Alone",

    2: "Returning to the Wreck",

    3: "Building Projects",

    4: "More Treasures from the Ship",

    5: "Improving Our Home",

    6: "Preparing for Winter",

    7: "Giving Thanks for Our Blessings",

    8: "The Stranded Whale",

    9: "The Death of a Monster",

    10: "Exploring the Island",

    11: "Home Again",

    12: "Jenny"

};


/* =========================================
   LOAD PAGE
========================================= */

async function loadCourse() {

    try {


        /* =================================
           CHECK LOGIN
        ================================= */

        const {
            data: sessionData
        } = await supabaseClient.auth.getSession();


        if (
            !sessionData ||
            !sessionData.session
        ) {

            window.location.href = "login.html";

            return;

        }


        /* =================================
           GET STUDENT
           USING THE EXISTING RPC
        ================================= */

        const {
            data: studentResult,
            error: studentError
        } = await supabaseClient
            .rpc("get_my_student");


        console.log(
            "get_my_student result:",
            studentResult
        );


        console.log(
            "get_my_student error:",
            studentError
        );


        if (studentError) {

            console.error(studentError);

            document.getElementById(
                "welcome"
            ).textContent =
                "Unable to load student information.";

            document.getElementById(
                "yearTitle"
            ).textContent =
                "Please try again.";

            return;

        }


        /* =================================
           RPC MAY RETURN ARRAY OR OBJECT
        ================================= */

        let student = null;


        if (
            Array.isArray(studentResult)
        ) {

            if (
                studentResult.length > 0
            ) {

                student =
                    studentResult[0];

            }

        } else {

            student =
                studentResult;

        }


        if (!student) {

            document.getElementById(
                "welcome"
            ).textContent =
                "Student information not found.";

            document.getElementById(
                "yearTitle"
            ).textContent =
                "Please log in again.";

            return;

        }


        console.log(
            "Student object:",
            student
        );


        /* =================================
           STUDENT NAME + GRADE
        ================================= */

        const studentName =
            student.student_name ||
            student.name ||
            "Student";


        const studentGrade =
            student.grade ||
            student.year_group;


        if (!studentGrade) {

            document.getElementById(
                "welcome"
            ).textContent =
                "Welcome, " +
                studentName +
                "!";

            document.getElementById(
                "yearTitle"
            ).textContent =
                "Your year group could not be found.";

            return;

        }


        document.getElementById(
            "welcome"
        ).textContent =
            "Welcome, " +
            studentName +
            "!";


        document.getElementById(
            "yearTitle"
        ).textContent =
            "You are studying " +
            studentGrade +
            ".";


        /* =================================
           LOAD COURSE UNITS
        ================================= */

        const {
            data: units,
            error: unitsError
        } = await supabaseClient
            .from("course_units")
            .select("*")
            .eq(
                "year_group",
                studentGrade
            )
            .order(
                "unit_number",
                {
                    ascending: true
                }
            );


        const unitsContainer =
            document.getElementById(
                "unitsContainer"
            );


        if (unitsError) {

            console.error(unitsError);

            unitsContainer.innerHTML = `
                <div class="error">
                    Unable to load course units.
                </div>
            `;

        } else {


            unitsContainer.innerHTML = "";


            if (
                !units ||
                units.length === 0
            ) {

                unitsContainer.innerHTML = `
                    <div class="message">
                        No course units have been added yet.
                    </div>
                `;

            } else {


                units.forEach(
                    function(unit) {


                        const card =
                            document.createElement(
                                "div"
                            );


                        card.className =
                            "card";


                        card.innerHTML = `

                            <div class="card-icon">
                                📘
                            </div>

                            <h3>
                                ${unit.title}
                            </h3>

                            <p>
                                Vocabulary • Grammar • Writing • Test
                            </p>

                            <a
                                href="unit.html?id=${unit.id}"
                                class="button"
                            >
                                Open Unit →
                            </a>

                        `;


                        unitsContainer.appendChild(
                            card
                        );


                    }
                );

            }

        }


        /* =================================
           LOAD STORY
        ================================= */

        const {
            data: chapters,
            error: chaptersError
        } = await supabaseClient
            .from("story_chapters")
            .select("*")
            .eq(
                "year_group",
                studentGrade
            )
            .order(
                "chapter_number",
                {
                    ascending: true
                }
            );


        const storyContainer =
            document.getElementById(
                "storyContainer"
            );


        if (chaptersError) {

            console.error(chaptersError);

            storyContainer.innerHTML = `
                <div class="error">
                    Unable to load story chapters.
                </div>
            `;

            return;

        }


        storyContainer.innerHTML = "";


        if (
            !chapters ||
            chapters.length === 0
        ) {

            storyContainer.innerHTML = `
                <div class="message">
                    No story chapters have been added yet.
                </div>
            `;

        } else {


            chapters.forEach(
                function(chapter) {


                    const number =
                        Number(
                            chapter.chapter_number
                        );


                    const title =
                        chapterNames[number] ||
                        chapter.title ||
                        "Untitled Chapter";


                    let page;


                    if (number === 1) {

                        page =
                            "story.html";

                    } else {

                        page =
                            "story" +
                            number +
                            ".html";

                    }


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "chapter-card";


                    card.innerHTML = `

                        <a
                            href="${page}"
                            style="text-decoration:none; color:inherit;"
                        >

                            <div class="chapter-icon">
                                📖
                            </div>

                            <div class="chapter-number">
                                Chapter ${number}
                            </div>

                            <div class="chapter-name">
                                ${title}
                            </div>

                        </a>

                    `;


                    storyContainer.appendChild(
                        card
                    );


                }
            );

        }


    } catch (error) {


        console.error(
            "Page error:",
            error
        );


        document.getElementById(
            "welcome"
        ).textContent =
            "Something went wrong.";


        document.getElementById(
            "yearTitle"
        ).textContent =
            "Please refresh the page and try again.";

    }

}


/* =========================================
   START
========================================= */

loadCourse();

</script>


</body>

</html>
