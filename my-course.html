<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Course - IGCSE English Hub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto 60px;
        }

        .welcome-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .welcome-box h2 {
            margin-top: 0;
            color: #1e3a8a;
        }

        .section-title {
            text-align: center;
            margin: 45px 0 25px;
        }

        .section-title h2 {
            margin-bottom: 8px;
            color: #0f172a;
        }

        .section-title p {
            color: #64748b;
            margin: 0;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            transition: 0.25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .card h3 {
            margin: 8px 0;
            color: #1e3a8a;
        }

        .card p {
            color: #64748b;
            line-height: 1.5;
        }

        .card a {
            text-decoration: none;
            color: inherit;
        }

        /* STORY */

        .story-section {
            margin-top: 55px;
        }

        .story-header {
            background: linear-gradient(135deg, #312e81, #1e40af);
            color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .story-header .story-main-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .story-header h2 {
            margin: 5px 0 10px;
            font-size: 28px;
        }

        .story-header p {
            margin: 0;
            opacity: 0.9;
        }

        .chapter-card {
            background: white;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            transition: 0.25s ease;
            border: 1px solid #e5e7eb;
        }

        .chapter-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
            border-color: #c7d2fe;
        }

        .chapter-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .chapter-number {
            font-size: 19px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .chapter-title {
            font-size: 17px;
            font-weight: bold;
            color: #334155;
            line-height: 1.4;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .read-button {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 18px;
            background: #1e3a8a;
            color: white !important;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s ease;
        }

        .read-button:hover {
            background: #312e81;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #64748b;
            font-size: 17px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
        }

        footer {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 26px;
            }

            .container {
                width: 94%;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .story-header h2 {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>📚 My Course</h1>

    <p>IGCSE English Hub</p>

</header>


<div class="container">

    <!-- WELCOME -->

    <div class="welcome-box">

        <h2 id="welcome">
            Welcome!
        </h2>

        <p id="yearTitle">
            Loading your course...
        </p>

    </div>


    <!-- COURSE UNITS -->

    <div class="section-title">

        <h2>📘 Course Units</h2>

        <p>
            Your English course units
        </p>

    </div>

    <div id="unitsContainer" class="cards">

        <div class="loading">
            Loading units...
        </div>

    </div>


    <!-- STORY -->

    <div class="story-section">

        <div class="story-header">

            <div class="story-main-icon">
                📖
            </div>

            <h2>The Story</h2>

            <p>
                Read the story chapter by chapter.
            </p>

        </div>


        <div id="storyContainer" class="cards">

            <div class="loading">
                Loading chapters...
            </div>

        </div>

    </div>

</div>


<footer>

    © 2026 IGCSE English Hub — All Rights Reserved

</footer>


<script>

    const SUPABASE_URL =
        "https://knazqfrjzgkqavnhzjwq.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    async function loadCourse() {

        try {

            /* =========================
               GET LOGGED-IN USER
            ========================= */

            const {
                data: {
                    user
                },
                error: userError
            } = await supabaseClient.auth.getUser();


            if (userError || !user) {

                window.location.href = "login.html";

                return;

            }


            /* =========================
               GET STUDENT INFORMATION
            ========================= */

            const {
                data: student,
                error: studentError
            } = await supabaseClient
                .from("students")
                .select("*")
                .eq("email", user.email)
                .limit(1)
                .maybeSingle();


            if (studentError) {

                console.error(studentError);

                document.getElementById("welcome").textContent =
                    "Unable to load student information.";

                return;

            }


            if (!student) {

                document.getElementById("welcome").textContent =
                    "Student information not found.";

                return;

            }


            /* =========================
               WELCOME
            ========================= */

            document.getElementById("welcome").textContent =
                "Welcome, " + student.student_name + "!";

            document.getElementById("yearTitle").textContent =
                "You are studying " + student.grade + ".";


            /* =========================
               LOAD UNITS
            ========================= */

            const {
                data: units,
                error: unitsError
            } = await supabaseClient
                .from("course_units")
                .select("*")
                .eq("year_group", student.grade)
                .order("unit_number", {
                    ascending: true
                });


            if (unitsError) {

                console.error(unitsError);

                document.getElementById("unitsContainer").innerHTML =
                    `<div class="error">
                        Unable to load course units.
                    </div>`;

            } else {

                const unitsContainer =
                    document.getElementById("unitsContainer");

                unitsContainer.innerHTML = "";


                if (!units || units.length === 0) {

                    unitsContainer.innerHTML =
                        `<div class="loading">
                            No course units have been added yet.
                        </div>`;

                } else {

                    units.forEach(unit => {

                        const card =
                            document.createElement("div");

                        card.className = "card";


                        card.innerHTML = `

                            <div class="card-icon">
                                📘
                            </div>

                            <h3>
                                ${unit.title}
                            </h3>

                            <p>
                                Vocabulary • Grammar • Writing • Test
                            </p>

                            <a
                                href="unit.html?id=${unit.id}"
                                class="read-button"
                            >
                                Open Unit →
                            </a>

                        `;


                        unitsContainer.appendChild(card);

                    });

                }

            }


            /* =========================
               LOAD STORY CHAPTERS
            ========================= */

            const {
                data: chapters,
                error: chaptersError
            } = await supabaseClient
                .from("story_chapters")
                .select("*")
                .eq("year_group", student.grade)
                .order("chapter_number", {
                    ascending: true
                });


            if (chaptersError) {

                console.error(chaptersError);

                document.getElementById("storyContainer").innerHTML =
                    `<div class="error">
                        Unable to load story chapters.
                    </div>`;

                return;

            }


            const storyContainer =
                document.getElementById("storyContainer");

            storyContainer.innerHTML = "";


            /* =========================
               FINAL 12 CHAPTER NAMES
            ========================= */

            const chapterNames = {

                1: "Shipwrecked and Alone",

                2: "Returning to the Wreck",

                3: "Building Projects",

                4: "More Treasures from the Ship",

                5: "Improving Our Home",

                6: "Preparing for Winter",

                7: "Giving Thanks for Our Blessings",

                8: "The Stranded Whale",

                9: "The Death of a Monster",

                10: "Exploring the Island",

                11: "Home Again",

                12: "Jenny"

            };


            if (!chapters || chapters.length === 0) {

                storyContainer.innerHTML =
                    `<div class="loading">
                        No story chapters have been added yet.
                    </div>`;

            } else {

                chapters.forEach(chapter => {

                    const number =
                        Number(chapter.chapter_number);


                    const title =
                        chapterNames[number] ||
                        chapter.title ||
                        `Chapter ${number}`;


                    let link;


                    if (number === 1) {

                        link = "story.html";

                    } else {

                        link = `story${number}.html`;

                    }


                    const card =
                        document.createElement("div");

                    card.className =
                        "chapter-card";


                    card.innerHTML = `

                        <div class="chapter-icon">
                            📖
                        </div>

                        <div class="chapter-number">
                            Chapter ${number}
                        </div>

                        <div class="chapter-title">
                            ${title}
                        </div>

                        <a
                            href="${link}"
                            class="read-button"
                        >
                            Read Chapter →
                        </a>

                    `;


                    storyContainer.appendChild(card);

                });

            }

        }

        catch (error) {

            console.error(error);

            document.getElementById("unitsContainer").innerHTML =
                `<div class="error">
                    Something went wrong while loading your course.
                </div>`;

        }

    }


    /* =========================
       START
    ========================= */

    loadCourse();

</script>

</body>

</html>
