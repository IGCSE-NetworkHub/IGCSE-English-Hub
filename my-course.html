<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Course - IGCSE English Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            color: #102a56;
        }

        header p {
            margin-top: 10px;
            color: #666;
        }

        .container {
            max-width: 1000px;
            margin: 45px auto;
            padding: 20px;
        }

        .year-title {
            text-align: center;
            color: #102a56;
            margin-bottom: 40px;
        }

        .section-title {
            color: #102a56;
            margin: 45px 0 25px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card,
        .chapter-card {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .card:hover,
        .chapter-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 22px rgba(16,42,86,.15);
        }

        .card-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .card h3,
        .chapter-card h3 {
            color: #102a56;
            margin: 10px 0;
        }

        .card p,
        .chapter-card p {
            color: #666;
            line-height: 1.5;
        }

        .card a,
        .chapter-card a {
            text-decoration: none;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 45px auto 20px;
            padding: 12px 25px;
            background: #102a56;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            transition: transform .2s ease, background .2s ease;
        }

        .back:hover {
            background: #174a8b;
            transform: translateY(-3px);
        }

        #loading {
            text-align: center;
            color: #666;
        }

        #error {
            display: none;
            text-align: center;
            color: #b00020;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }

        .chapter-number {
            display: inline-block;
            background: #eef5ff;
            color: #174a8b;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .chapter-card a {
            display: block;
        }

        .chapter-card h3 {
            transition: color .2s ease;
        }

        .chapter-card a:hover h3 {
            color: #174a8b;
        }

    </style>
</head>

<body>

<header>

    <h1>📚 My Course</h1>

    <p id="welcome">
        Loading your course...
    </p>

</header>


<div class="container">

    <h2 class="year-title" id="yearTitle"></h2>

    <p id="loading">
        Loading your course...
    </p>

    <p id="error"></p>


    <!-- ================= COURSE UNITS ================= -->

    <h2 class="section-title">
        📘 Course Units
    </h2>

    <div class="cards" id="unitsContainer"></div>


    <!-- ================= STORY ================= -->

    <h2 class="section-title">
        📖 Story
    </h2>

    <div class="cards" id="storyContainer"></div>


    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>


<footer>
    © 2026 IGCSE English Hub — All Rights Reserved
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://knazqfrjzgkqavnhzjwq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


async function loadCourse() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href = "login.html";

        return;
    }


    /* =========================
       GET STUDENT
       ========================= */

    const {
        data: student,
        error: studentError
    } = await supabaseClient.rpc(
        "get_my_student"
    );


    if (studentError) {

        showError(studentError.message);

        return;
    }


    if (!student || student.length === 0) {

        showError(
            "Student information not found."
        );

        return;
    }


    const studentName =
        student[0].student_name;

    const yearGroup =
        student[0].grade;


    document.getElementById("welcome").textContent =
        "Welcome, " + studentName;


    document.getElementById("yearTitle").textContent =
        yearGroup + " Course";


    /* =========================
       GET COURSE UNITS
       ========================= */

    const {
        data: units,
        error: unitsError
    } = await supabaseClient
        .from("course_units")
        .select("id, title, unit_number")
        .eq("year_group", yearGroup)
        .order("unit_number", {
            ascending: true
        });


    if (unitsError) {

        showError(unitsError.message);

        return;
    }


    const unitsContainer =
        document.getElementById("unitsContainer");


    if (!units || units.length === 0) {

        unitsContainer.innerHTML =
            "<p>No units have been added yet.</p>";

    } else {

        units.forEach(function(unit) {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <div class="card-icon">
                    📘
                </div>

                <a href="unit.html?id=${unit.id}">

                    <h3>
                        ${unit.title}
                    </h3>

                </a>

                <p>
                    Vocabulary, Grammar,
                    Writing and End of Unit Test.
                </p>

            `;

            unitsContainer.appendChild(card);

        });

    }


    /* =========================
       GET STORY CHAPTERS
       ========================= */

    const {
        data: chapters,
        error: chaptersError
    } = await supabaseClient
        .from("story_chapters")
        .select(
            "id, chapter_number, title, description"
        )
        .eq("year_group", yearGroup)
        .order("chapter_number", {
            ascending: true
        });


    if (chaptersError) {

        showError(chaptersError.message);

        return;
    }


    const storyContainer =
        document.getElementById("storyContainer");


    if (!chapters || chapters.length === 0) {

        storyContainer.innerHTML =
            "<p>No story chapters have been added yet.</p>";

    } else {

        chapters.forEach(function(chapter) {

            const card =
                document.createElement("div");

            card.className = "chapter-card";


            /* =====================================
               FIXED CHAPTER LINKS
               ===================================== */

            let link = "story.html";

            if (Number(chapter.chapter_number) === 2) {
                link = "story2.html";
            }

            else if (Number(chapter.chapter_number) === 3) {
                link = "story3.html";
            }

            else if (Number(chapter.chapter_number) === 4) {
                link = "story4.html";
            }

            else if (Number(chapter.chapter_number) === 5) {
                link = "story5.html";
            }

            else if (Number(chapter.chapter_number) === 6) {
                link = "story6.html";
            }

            else if (Number(chapter.chapter_number) === 7) {
                link = "story7.html";
            }

            else if (Number(chapter.chapter_number) === 8) {
                link = "story8.html";
            }

            else if (Number(chapter.chapter_number) === 9) {
                link = "story9.html";
            }

            else if (Number(chapter.chapter_number) === 10) {
                link = "story10.html";
            }

            else if (Number(chapter.chapter_number) === 11) {
                link = "story11.html";
            }

            else if (Number(chapter.chapter_number) === 12) {
                link = "story12.html";
            }


            card.innerHTML = `

                <div class="card-icon">
                    📖
                </div>

                <div class="chapter-number">
                    Chapter ${chapter.chapter_number}
                </div>

                <a
                    href="${link}"
                    target="_self"
                >

                    <h3>
                        ${chapter.title}
                    </h3>

                </a>

                <p>
                    ${chapter.description ||
                    "Read this chapter."}
                </p>

            `;


            storyContainer.appendChild(card);

        });

    }


    document.getElementById("loading").style.display =
        "none";

}


/* =========================
   ERROR FUNCTION
   ========================= */

function showError(message) {

    document.getElementById("loading").style.display =
        "none";

    const error =
        document.getElementById("error");

    error.style.display =
        "block";

    error.textContent =
        message;

}


/* =========================
   START
   ========================= */

loadCourse();

</script>

</body>
</html>
