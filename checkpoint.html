<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambridge Checkpoint Course - IGCSE English Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #ffffff;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            color: #102a56;
        }

        header p {
            margin-top: 10px;
            color: #666;
        }

        .container {
            max-width: 900px;
            margin: 45px auto;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .card h3 {
            color: #102a56;
            margin: 10px 0 15px;
        }

        .card p {
            color: #666;
            line-height: 1.6;
        }

        .card a {
            text-decoration: none;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 40px auto 20px;
            padding: 12px 25px;
            background: #102a56;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        #loading {
            text-align: center;
            color: #666;
        }

        #error {
            display: none;
            text-align: center;
            color: #b00020;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>

    <h1>Cambridge Checkpoint Course</h1>

    <p>
        Prepare, practise and test yourself for Cambridge Checkpoint
    </p>

</header>

<div class="container">

    <p id="loading">
        Loading course sections...
    </p>

    <p id="error"></p>

    <div class="cards" id="sectionsContainer"></div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>

<footer>
    © 2026 IGCSE English Hub — All Rights Reserved
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://knazqfrjzgkqavnhzjwq.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

async function loadCheckpoint() {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (!session) {

        window.location.href = "login.html";

        return;
    }

    const {
        data: sections,
        error
    } = await supabaseClient
        .from("checkpoint_sections")
        .select("id, title, section_order")
        .order("section_order", { ascending: true });

    document.getElementById("loading").style.display =
        "none";

    if (error) {

        showError(error.message);

        return;
    }

    if (!sections || sections.length === 0) {

        showError(
            "No Checkpoint course sections have been added yet."
        );

        return;
    }

    const container =
        document.getElementById("sectionsContainer");

    sections.forEach(function(section) {

        let icon = "🎓";

        if (section.title === "General Preparation Course") {
            icon = "📚";
        }

        if (section.title === "Classified Papers") {
            icon = "📄";
        }

        if (section.title === "Past Papers") {
            icon = "📝";
        }

        if (section.title === "Test Yourself") {
            icon = "🧪";
        }

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <div class="icon">
                ${icon}
            </div>

            <a href="#">
                <h3>${section.title}</h3>
            </a>

            <p>
                Access this section of the
                Cambridge Checkpoint Course.
            </p>

        `;

        container.appendChild(card);

    });

}

function showError(message) {

    document.getElementById("loading").style.display =
        "none";

    const error =
        document.getElementById("error");

    error.style.display = "block";

    error.textContent = message;
}

loadCheckpoint();

</script>

</body>
</html>
