.highlight{background:#fff8df;border-left:5px solid #e2b400;padding:15px 18px;margin:20px 0;border-radius:0 8px 8px 0}
.info-grid,.vocab-grid,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px;margin-bottom:24px}
.info-card,.vocab-item,.card{background:#f7f9fc;border:1px solid #e1e7ef;border-radius:14px;padding:20px;transition:transform .25s ease,box-shadow .25s ease}.info-card:hover,.vocab-item:hover,.card:hover{transform:translateY(-3px);box-shadow:0 9px 22px rgba(0,0,0,.08)}.info-card h3,.card h3{margin-top:0;color:#102a56}.vocab-item strong,.vocab-card strong{color:#102a56}
.question,.quiz-question,.fill-item,.quote-card{border:1px solid #e1e7ef;border-radius:12px;margin-bottom:14px;padding:18px;background:#fff}.question strong,.quiz-question strong{display:block;color:#102a56;line-height:1.6}.answer,.fill-answer,.quote-details,.quiz-answer{display:none;padding:18px;margin-top:14px;line-height:1.7;background:#f8fbff;border-top:1px solid #e5e9ef;border-radius:8px}.answer.show,.fill-answer.show,.quote-details.show,.quiz-answer.show{display:block;animation:openAnswer .3s ease}
.answer-btn,.show-answer-btn{display:inline-block;margin-top:14px;padding:9px 16px;border:0;border-radius:8px;background:#102a56;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;transition:.2s}.answer-btn:hover,.show-answer-btn:hover{background:#1d4f91;transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,42,86,.2)}
.fill-question{font-weight:bold;color:#102a56;line-height:1.6}.quote-card blockquote{margin:0 0 15px;padding:15px;background:#f1f6fc;border-left:5px solid #1d4f91;border-radius:0 8px 8px 0;font-style:italic;line-height:1.7}.quote-details strong{color:#102a56}.quiz-title{color:#102a56;font-size:25px;margin:20px 28px}.answer-line{margin-top:15px;border-bottom:1px solid #888;height:25px}
.back-button{display:inline-block;text-decoration:none;background:#102a56;color:#fff;padding:14px 24px;border-radius:10px;font-weight:bold;margin:10px 0 40px;transition:.2s}.back-button:hover{background:#0b1d3d;transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.15)}
footer{text-align:center;padding:30px;color:#666;margin-left:280px}
#access-gate{width:calc(100% - 320px);max-width:1050px;margin:35px 30px 35px 300px;padding:0 20px;position:relative;z-index:1}
#access-gate .section{max-width:700px;margin:0 auto 28px}
#access-gate .gate-content{padding:28px}.gate-content p{line-height:1.7}.gate-content label{display:block;font-weight:bold;margin:12px 0 8px}.gate-content input{width:100%;max-width:420px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}.gate-content button{display:block;margin-top:12px;padding:12px 20px;border:0;border-radius:8px;background:#102a56;color:white;font-weight:bold;cursor:pointer}.gate-content button:disabled{opacity:.6;cursor:wait}
#protected-lesson{display:none;width:calc(100% - 320px);max-width:1050px;margin:35px 30px 35px 300px;padding:0 20px;min-width:0}#protected-lesson .container{width:100%;max-width:none;margin:0;padding:0}#protected-lesson>header,#protected-lesson>nav.lesson-nav,#protected-lesson>footer{display:none!important}
@media(max-width:1000px){.lesson-nav{width:235px;padding:24px 14px}.container,#access-gate,#protected-lesson{width:calc(100% - 265px);margin-left:250px;margin-right:10px;padding:0 15px}footer{margin-left:235px}}
@media(max-width:700px){header{padding:40px 15px}header h1{font-size:31px}header p{font-size:18px}.lesson-nav{position:relative;left:auto;top:auto;width:calc(100% - 30px);height:auto;max-height:none;overflow:visible;margin:20px 15px 25px;padding:18px;border-radius:16px;border:1px solid #dfe6ef;box-shadow:0 5px 18px rgba(0,0,0,.1)}.lesson-nav h3{text-align:center}.nav-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.nav-buttons a{justify-content:center;text-align:center;white-space:normal;min-height:46px;padding:10px 7px;font-size:13px}.nav-buttons a.active{transform:translateY(-2px)}.container,#access-gate,#protected-lesson{width:auto;margin:20px auto;padding:0 15px}.section>h2{padding:19px 20px;font-size:21px}.section>p,.section>.story-text,.section>.info-grid,.section>.vocab-grid,.section>.question,.section>.fill-item,.section>.quote-card,.section>.quiz-title,.section>.quiz-question,.section>ul,.section>ol,.section>.highlight,.section>.quote,.section>div:not(.section-title):not(.section-content){margin-left:20px;margin-right:20px}.story-text{font-size:17px;line-height:1.8}.info-grid,.vocab-grid,.cards{grid-template-columns:1fr}.gate-content{padding:20px!important}footer{margin-left:0}}
@media(max-width:430px){.nav-buttons{grid-template-columns:1fr}.nav-buttons a{justify-content:flex-start;text-align:left;padding-left:15px}header h1{font-size:28px}header p{font-size:16px}}

<header><h1>Chapter 2</h1><p>Returning to the Wreck</p></header>

<a href="#reading">📖 Read</a><a href="#summary">📘 Summary</a><a href="#theme">🎯 Theme</a><a href="#characters">👥 Characters</a><a href="#vocabulary">📚 Vocabulary</a><a href="#questions">❓ Questions</a><a href="#fill">✏️ Fill in</a><a href="#quotations">💬 Quotations</a><a href="#quiz1">🧠 Quiz 1</a><a href="#quiz2">🏆 Quiz 2</a>
</div></nav>
<div id="access-gate"><div class="section"><h2>🔐 Chapter 2 Access</h2><div class="gate-content"><p id="access-message">Checking your access...</p><div id="activation-form" style="display:none"><label for="activation-code">Enter your Chapter 2 activation code</label><input id="activation-code" type="text" autocomplete="off"><button id="activate-button" type="button">Activate Chapter 2</button></div><p id="login-link" style="display:none"><a href="login.html">Please log in first</a>.</p></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
 const SUPABASE_URL="https://knazqfrjzgkqavnhzjwq.supabase.co";
 const SUPABASE_ANON_KEY="sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";
 const CHAPTER_ID=4;
 const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const gate=document.getElementById("access-gate"),message=document.getElementById("access-message"),form=document.getElementById("activation-form"),codeInput=document.getElementById("activation-code"),activateButton=document.getElementById("activate-button"),loginLink=document.getElementById("login-link"),lessonHost=document.getElementById("protected-lesson");
 function showMessage(text){message.textContent=text}
 function showLoginRequired(){showMessage("You need to log in before opening this chapter.");loginLink.style.display="block";form.style.display="none"}
 async function loadProtectedLesson(){
  const {data,error}=await client.rpc("get_unlocked_content",{p_content_type:"chapter",p_content_id:CHAPTER_ID});
  if(error){console.error(error);showMessage("We couldn't verify access. Please refresh the page or contact your teacher.");return false}
  if(!data||!data.length||!data[0].body)return false;
  lessonHost.innerHTML=data[0].body;
  gate.style.display="none";lessonHost.style.display="block";
  lessonHost.querySelectorAll("script").forEach(oldScript=>{const newScript=document.createElement("script");newScript.textContent=oldScript.textContent;oldScript.replaceWith(newScript)});
  lessonHost.addEventListener("contextmenu",event=>event.preventDefault());lessonHost.addEventListener("copy",event=>event.preventDefault());lessonHost.addEventListener("cut",event=>event.preventDefault());
  setupSidebar();return true
 }
 function setupSidebar(){
  const links=document.querySelectorAll(".lesson-nav .nav-buttons a");
  links.forEach(link=>link.addEventListener("click",event=>{const id=link.getAttribute("href");const target=lessonHost.querySelector(id);if(target){event.preventDefault();target.scrollIntoView({behavior:"smooth",block:"start"})}}));
  const sections=lessonHost.querySelectorAll(".section,[id]");
  const update=()=>{let current="";sections.forEach(section=>{if(section.id&&window.scrollY>=section.getBoundingClientRect().top+window.scrollY-150)current=section.id});links.forEach(link=>link.classList.toggle("active",link.getAttribute("href")==="#"+current))};
  window.addEventListener("scroll",update);update();
 }
 async function initialize(){const {data:sessionData,error:sessionError}=await client.auth.getSession();if(sessionError||!sessionData.session){showLoginRequired();return}const alreadyUnlocked=await loadProtectedLesson();if(!alreadyUnlocked){showMessage("This chapter is locked. Enter the activation code assigned to your account.");form.style.display="block"}}
 activateButton.addEventListener("click",async()=>{
  const code=codeInput.value.trim();if(!code){showMessage("Enter your activation code first.");return}
  activateButton.disabled=true;showMessage("Checking your activation code...");
  try{
   const {data:sessionData,error:sessionError}=await client.auth.getSession();if(sessionError||!sessionData.session){showLoginRequired();return}
   const {data,error}=await client.rpc("activate_content_code",{p_code:code});
   if(error){console.error(error);showMessage("The code couldn't be checked. Please try again.");return}
   const matched=Array.isArray(data)&&data.some(item=>item.content_type==="chapter"&&Number(item.content_id)===CHAPTER_ID);
   if(!matched){showMessage("This code is invalid, already used, or assigned to a different chapter/student.");return}
   showMessage("Code accepted. Opening Chapter 2...");
   const loaded=await loadProtectedLesson();if(!loaded)showMessage("The code was accepted, but the protected lesson is not ready yet. Please contact your teacher.");
  }catch(error){console.error(error);showMessage("Something went wrong. Please refresh the page and try again.")}
  finally{activateButton.disabled=false}
 });
 codeInput.addEventListener("keydown",event=>{if(event.key==="Enter")activateButton.click()});
 initialize();
})();
</script>
