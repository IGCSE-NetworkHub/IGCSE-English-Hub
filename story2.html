<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 2 - Returning to the Wreck | IGCSE English Hub</title>
<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7fb;
    color: #222;
}

/* ================= HEADER ================= */

header {
    background: linear-gradient(135deg, #102a56, #1e4f91);
    color: white;
    padding: 42px 20px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
}

header h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: .5px;
}

header p {
    margin: 10px 0 0;
    font-size: 20px;
    opacity: .95;
}

/* ================= SIDEBAR ================= */

.lesson-nav {
    position: fixed;
    left: 0;
    top: 0;
    width: 255px;
    height: 100vh;
    background: white;
    border-right: 1px solid #d9e0ea;
    padding: 25px 15px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 3px 0 12px rgba(0,0,0,.05);
}

.lesson-nav h3 {
    text-align: center;
    color: #102a56;
    margin: 5px 0 20px;
    font-size: 20px;
}

.nav-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.nav-buttons a {
    text-decoration: none;
    color: #102a56;
    background: #eef3f9;
    padding: 11px 13px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: bold;
    transition: .2s;
}

.nav-buttons a:hover {
    background: #dbe7f5;
    transform: translateX(3px);
}

.nav-buttons a.active {
    background: #102a56;
    color: white;
    transform: translateX(5px);
    box-shadow: 0 5px 12px rgba(16,42,86,.18);
}

/* ================= MAIN ================= */

.main-content {
    margin-left: 255px;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.section {
    background: white;
    margin-bottom: 28px;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 18px rgba(0,0,0,.07);
    scroll-margin-top: 25px;
}

.section h2 {
    margin-top: 0;
    color: #102a56;
    border-bottom: 3px solid #dbe7f5;
    padding-bottom: 12px;
}

.section h3 {
    color: #1e4f91;
}

.story-text {
    font-size: 18px;
    line-height: 1.85;
}

.story-text p {
    margin-bottom: 20px;
}

.quote {
    background: #f0f5fb;
    border-left: 5px solid #1e4f91;
    padding: 18px;
    margin: 20px 0;
    border-radius: 8px;
    font-style: italic;
}

.highlight {
    background: #fff7d6;
    padding: 3px 7px;
    border-radius: 5px;
}

/* ================= INFO CARDS ================= */

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.info-card {
    background: #f6f8fc;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #dce4ef;
}

.info-card h3 {
    margin-top: 0;
}

/* ================= VOCABULARY ================= */

.vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 15px;
}

.vocab-item {
    background: #f7f9fc;
    border: 1px solid #dce4ef;
    border-radius: 10px;
    padding: 15px;
}

.vocab-item strong {
    color: #102a56;
}

/* ================= QUESTIONS ================= */

.question {
    background: #f8fafc;
    border: 1px solid #dce4ef;
    border-radius: 10px;
    padding: 17px;
    margin-bottom: 14px;
}

.question strong {
    color: #102a56;
    display: block;
    line-height: 1.6;
}

.answer {
    display: none;
    margin-top: 12px;
    background: #eef5ff;
    border-left: 4px solid #1e4f91;
    padding: 13px;
    border-radius: 6px;
    line-height: 1.7;
}

.answer.show {
    display: block;
    animation: openAnswer .3s ease;
}

.answer-btn {
    margin-top: 12px;
    border: none;
    background: #102a56;
    color: white;
    padding: 9px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    transition: .2s;
}

.answer-btn:hover {
    background: #1e4f91;
    transform: translateY(-1px);
}

@keyframes openAnswer {
    from {
        opacity: 0;
        transform: translateY(-5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================= FILL ================= */

.fill-item {
    background: #f8fafc;
    border: 1px solid #dce4ef;
    border-radius: 9px;
    padding: 15px;
    margin-bottom: 12px;
}

.fill-question {
    font-weight: bold;
    color: #102a56;
    line-height: 1.6;
}

.fill-answer {
    display: none;
    margin-top: 12px;
    background: #eef5ff;
    border-left: 4px solid #1e4f91;
    padding: 11px 14px;
    border-radius: 6px;
    line-height: 1.6;
}

.fill-answer.show {
    display: block;
    animation: openAnswer .3s ease;
}

/* ================= QUOTATIONS ================= */

.quote-card {
    background: #f8fafc;
    border: 1px solid #dce4ef;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
}

.quote-card blockquote {
    margin: 0 0 15px;
    padding: 15px;
    background: #eef5ff;
    border-left: 5px solid #1e4f91;
    border-radius: 7px;
    font-style: italic;
    line-height: 1.7;
}

.quote-details {
    display: none;
    line-height: 1.7;
    background: white;
    padding: 15px;
    border-radius: 8px;
    border: 1px solid #dce4ef;
    margin-top: 12px;
}

.quote-details.show {
    display: block;
    animation: openAnswer .3s ease;
}

.quote-details strong {
    color: #102a56;
}

/* ================= QUIZ ================= */

.quiz-title {
    color: #102a56;
    font-size: 25px;
    margin-bottom: 20px;
}

.quiz-question {
    background: #f8fafc;
    border: 1px solid #dce4ef;
    padding: 18px;
    margin-bottom: 15px;
    border-radius: 10px;
}

.quiz-question strong {
    color: #102a56;
    display: block;
    line-height: 1.6;
}

.quiz-answer {
    display: none;
    margin-top: 12px;
    background: #eef5ff;
    border-left: 4px solid #1e4f91;
    padding: 13px;
    border-radius: 6px;
    line-height: 1.7;
}

.quiz-answer.show {
    display: block;
    animation: openAnswer .3s ease;
}

.answer-line {
    margin-top: 15px;
    border-bottom: 1px solid #888;
    height: 25px;
}

/* ================= BACK BUTTON ================= */

.back-button {
    display: inline-block;
    text-decoration: none;
    background: #102a56;
    color: white;
    padding: 13px 22px;
    border-radius: 9px;
    font-weight: bold;
    transition: .2s;
}

.back-button:hover {
    background: #1e4f91;
    transform: translateY(-2px);
}

/* ================= FOOTER ================= */

footer {
    margin-left: 255px;
    background: #102a56;
    color: white;
    text-align: center;
    padding: 22px;
}

/* ================= MOBILE ================= */

@media (max-width: 850px) {

    .lesson-nav {
        position: relative;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid #d9e0ea;
    }

    .nav-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
    }

    .main-content {
        margin-left: 0;
        padding: 18px;
    }

    footer {
        margin-left: 0;
    }

    header h1 {
        font-size: 30px;
    }

    header p {
        font-size: 18px;
    }
}

@media (max-width: 500px) {

    .nav-buttons {
        grid-template-columns: 1fr;
    }

    .section {
        padding: 20px;
    }

    .story-text {
        font-size: 16px;
    }
}


/* Access gate styling */
#access-gate { margin: 35px auto; max-width: 850px; }
#access-gate .section { background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 5px 18px rgba(0,0,0,.07); }
#protected-lesson { display: none; }
</style>
</head>
<body>
<header>
    <h1>Chapter 2</h1>
    <p>Returning to the Wreck</p>
</header>
<nav class="lesson-nav">
    <h3>📖 Chapter 2</h3>
    <div class="nav-buttons">
        <a href="#reading">📖 Reading</a>
        <a href="#summary">📝 Summary</a>
        <a href="#theme">💡 Theme</a>
        <a href="#characters">👥 Characters</a>
        <a href="#vocabulary">📚 Vocabulary</a>
        <a href="#questions">❓ Questions</a>
        <a href="#fill">✏️ Fill in</a>
        <a href="#quotations">💬 Quotations</a>
        <a href="#quiz1">🧠 Quiz 1</a>
        <a href="#quiz2">🏆 Quiz 2</a>
    </div>
</nav>
<div id="access-gate" class="container">
    <div class="section">
        <h2>🔐 Chapter 2 Access</h2>
        <p id="access-message">Checking your access...</p>
        <div id="activation-form" style="display:none; margin-top:18px;">
            <label for="activation-code" style="display:block;font-weight:bold;margin-bottom:8px;">Enter your Chapter 2 activation code</label>
            <input id="activation-code" type="text" autocomplete="off" style="width:100%;max-width:420px;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;">
            <button id="activate-button" type="button" style="display:block;margin-top:12px;padding:12px 20px;border:0;border-radius:8px;background:#102a56;color:white;font-weight:bold;cursor:pointer;">Activate Chapter 2</button>
        </div>
        <p id="login-link" style="display:none;"><a href="login.html">Please log in first</a>.</p>
        <p><a href="my-course.html" class="back-button">← Back to My Course</a></p>
    </div>
</div>
<div id="protected-lesson"></div>
<footer>© 2026 IGCSE English Hub — All Rights Reserved</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
    const SUPABASE_URL = "https://knazqfrjzgkqavnhzjwq.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";
    const CHAPTER_ID = 4;
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const gate = document.getElementById("access-gate");
    const message = document.getElementById("access-message");
    const form = document.getElementById("activation-form");
    const codeInput = document.getElementById("activation-code");
    const activateButton = document.getElementById("activate-button");
    const loginLink = document.getElementById("login-link");
    const lessonHost = document.getElementById("protected-lesson");
    function showMessage(text) { message.textContent = text; }
    function showLoginRequired() {
        showMessage("You need to log in before opening this chapter.");
        loginLink.style.display = "block";
        form.style.display = "none";
    }
    async function loadProtectedLesson() {
        const { data, error } = await client.rpc("get_unlocked_content", {
            p_content_type: "chapter", p_content_id: CHAPTER_ID
        });
        if (error) {
            showMessage("We couldn't verify access. Please refresh the page or contact your teacher.");
            console.error(error); return false;
        }
        if (!data || !data.length || !data[0].body) return false;
        lessonHost.innerHTML = data[0].body;
        gate.style.display = "none";
        lessonHost.style.display = "block";
        lessonHost.querySelectorAll("script").forEach(oldScript => {
            const newScript = document.createElement("script");
            newScript.textContent = oldScript.textContent;
            oldScript.replaceWith(newScript);
        });
        lessonHost.addEventListener("contextmenu", event => event.preventDefault());
        lessonHost.addEventListener("copy", event => event.preventDefault());
        lessonHost.addEventListener("cut", event => event.preventDefault());
        return true;
    }
    async function initialize() {
        const { data: sessionData, error: sessionError } = await client.auth.getSession();
        if (sessionError || !sessionData.session) { showLoginRequired(); return; }
        const alreadyUnlocked = await loadProtectedLesson();
        if (!alreadyUnlocked) {
            showMessage("This chapter is locked. Enter the activation code assigned to your account.");
            form.style.display = "block";
        }
    }
    activateButton.addEventListener("click", async () => {
        const code = codeInput.value.trim();
        if (!code) { showMessage("Enter your activation code first."); return; }
        activateButton.disabled = true;
        showMessage("Checking your activation code...");
        const { data, error } = await client.rpc("activate_content_code", { p_code: code });
        activateButton.disabled = false;
        if (error) { showMessage("The code couldn't be checked. Please try again."); console.error(error); return; }
        const matched = Array.isArray(data) && data.some(item => item.content_type === "chapter" && Number(item.content_id) === CHAPTER_ID);
        if (!matched) { showMessage("This code is invalid, already used, or assigned to a different chapter/student."); return; }
        showMessage("Code accepted. Opening Chapter 2...");
        const loaded = await loadProtectedLesson();
        if (!loaded) showMessage("The code was accepted, but the protected lesson is not ready yet. Please contact your teacher.");
    });
    codeInput.addEventListener("keydown", event => { if (event.key === "Enter") activateButton.click(); });
    initialize();
})();
</script>
</body>
</html>
