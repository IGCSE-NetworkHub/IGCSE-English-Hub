<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit | IGCSE English Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#172033}header{background:#142b4a;color:white;padding:26px 5%;text-align:center}header h1{margin:0;font-size:28px}header p{color:#dbe6f5;margin:8px 0 0}.container{max-width:1000px;margin:28px auto;padding:0 18px}.notice{padding:13px 15px;background:#e8f2ff;color:#17457c;border-radius:8px}.error{display:none;background:#fff0f0;color:#a21c1c;padding:13px 15px;border-radius:8px}.section{background:white;border-radius:14px;padding:22px;margin:22px 0;box-shadow:0 4px 18px #152b4a0d}.section h2{margin-top:0;color:#142b4a}.muted{color:#65748b}.session{border:1px solid #dce4ef;border-radius:10px;margin:12px 0;overflow:hidden}.session summary{padding:15px;background:#f7f9fc;cursor:pointer;font-weight:bold}.session-body{padding:15px}.item{border:1px solid #e3eaf3;border-left:4px solid #6c93ca;border-radius:8px;padding:13px;margin:10px 0;background:#fff}.item h3{margin:0 0 8px;font-size:17px}.item p{white-space:pre-wrap;line-height:1.55;margin:8px 0}.meta{font-size:12px;color:#65748b;margin-bottom:8px}.link{display:inline-block;margin-top:8px;background:#1769d2;color:#fff;padding:9px 13px;border-radius:7px;text-decoration:none;font-weight:bold}.test{border:1px solid #dce4ef;border-radius:10px;padding:16px;margin:12px 0}.test h3{margin:0 0 8px}.pill{display:inline-block;font-size:12px;background:#e1f7e8;color:#176534;padding:5px 9px;border-radius:20px;font-weight:bold}.empty{padding:13px;background:#f8fafc;border-radius:8px;color:#65748b}.back{display:inline-block;margin:5px 0 28px;color:#1769d2;text-decoration:none;font-weight:bold}footer{text-align:center;padding:24px;color:#65748b;font-size:13px}
</style></head><body>
<header><h1 id="unitTitle">Loading unit...</h1><p id="unitSubtitle">Sessions and Unit Tests</p></header>
<main class="container"><p id="loading" class="notice">Loading unit content...</p><p id="error" class="error"></p>
<section class="section"><h2>📚 Sessions</h2><p class="muted">Open a session to view its learning materials.</p><div id="sessionsContainer"></div></section>
<section class="section"><h2>🧪 Unit Tests</h2><p class="muted">Published tests for this unit.</p><div id="testsContainer"></div></section>
<a class="back" href="my-course.html">← Back to My Course</a></main><footer>© 2026 IGCSE English Hub — All Rights Reserved</footer>
<script>
const SUPABASE_URL='https://knazqfrjzgkqavnhzjwq.supabase.co';
const SUPABASE_KEY='sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function node(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=text;return n}
function showError(text){$('loading').style.display='none';$('error').style.display='block';$('error').textContent=text}
async function loadUnit(){
 try{
  const {data:auth,error:authError}=await db.auth.getSession();if(authError||!auth?.session){window.location.href='login.html';return}
  const unitId=new URLSearchParams(location.search).get('id');if(!unitId){showError('Unit not found.');return}
  const {data:units,error:unitError}=await db.from('course_units').select('id,title,year_group,unit_number').eq('id',unitId).limit(1);
  if(unitError)throw unitError;if(!units?.length){showError('Unit not found.');return}const unit=units[0];$('unitTitle').textContent=unit.title;$('unitSubtitle').textContent=(unit.year_group||'')+' · Unit '+(unit.unit_number??'')+' · Sessions and Unit Tests';
  await Promise.all([loadSessions(unitId),loadTests(unitId)]);$('loading').style.display='none';
 }catch(err){console.error(err);showError('Could not load this unit. '+(err.message||''))}
}
async function loadSessions(unitId){
 const host=$('sessionsContainer');
 const {data:sessions,error}=await db.from('course_sessions').select('id,title,description,sort_order,is_published').eq('unit_id',unitId).eq('is_published',true).order('sort_order',{ascending:true});
 if(error){host.append(node('div','empty','Sessions could not be loaded: '+error.message));return}
 if(!sessions?.length){host.append(node('div','empty','No published sessions are available for this unit yet.'));return}
 for(const session of sessions){
  const details=node('details','session');const defaultTitle=session.sort_order===4?'Session 4 — Consolidation':'Session '+session.sort_order;
  details.append(node('summary','',session.title||defaultTitle));const body=node('div','session-body');if(session.description)body.append(node('p','muted',session.description));const itemsArea=node('div','','Loading session materials...');body.append(itemsArea);details.append(body);host.append(details);
  const {data:items,error:itemError}=await db.from('session_items').select('id,title,item_type,content,file_url,sort_order,is_required').eq('session_id',session.id).order('sort_order',{ascending:true});
  itemsArea.replaceChildren();if(itemError){itemsArea.append(node('div','empty','Materials could not be loaded: '+itemError.message));continue}
  if(!items?.length){itemsArea.append(node('div','empty','No learning materials have been added to this session yet.'));continue}
  for(const item of items){const box=node('article','item');box.append(node('h3','',item.title||'Learning material'),node('div','meta',(item.item_type||'content').replaceAll('_',' ').toUpperCase()+' · Item '+item.sort_order));if(item.content)box.append(node('p','',item.content));if(item.file_url){const a=node('a','link','Open resource');a.href=item.file_url;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}itemsArea.append(box)}
 }
}
async function loadTests(unitId){
 const host=$('testsContainer');const {data:tests,error}=await db.from('unit_tests').select('id,title,description,test_type,duration_minutes,total_marks,file_url,sort_order,is_published').eq('unit_id',unitId).eq('is_published',true).order('sort_order',{ascending:true});
 if(error){host.append(node('div','empty','Unit tests could not be loaded: '+error.message));return}
 if(!tests?.length){host.append(node('div','empty','No published unit tests are available yet.'));return}
 for(const test of tests){const box=node('article','test');box.append(node('h3','',test.title));box.append(node('p','muted',(test.description?test.description+' · ':'')+(test.duration_minutes||45)+' minutes · '+(test.total_marks??0)+' marks'));box.append(node('span','pill','Published'));
  if(test.test_type==='pdf'&&test.file_url){const a=node('a','link','Open Test PDF');a.href=test.file_url;a.target='_blank';a.rel='noopener noreferrer';box.append(a)}else{const a=node('a','link','Open Online Tests');a.href='progress-tests.html';box.append(a)}host.append(box)}
}
loadUnit();
</script></body></html>
