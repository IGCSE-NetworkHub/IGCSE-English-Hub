<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explanation Videos | IGCSE English Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fc;color:#172554}header{background:#102a56;color:white;padding:22px 6%}header h2{margin:0;font-size:22px}header p{color:#dbeafe;margin:8px 0 0;font-size:14px}main{max-width:1100px;margin:auto;padding:35px 20px 55px}.page-heading{margin-bottom:25px}.page-heading h1{font-size:32px;color:#102a56;margin:0 0 12px}.page-heading p{color:#607089;line-height:1.7}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:22px}.session-tile{width:100%;min-height:0;padding:22px 18px 20px;border:1px solid #dbe5f2;border-radius:16px;background:white;color:#102a56;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;text-align:center;box-shadow:0 6px 20px #102a560f;transition:.18s}.session-tile:hover{border-color:#2563eb;box-shadow:0 10px 26px #2563eb21;transform:translateY(-2px)}.session-icon{display:flex;width:76px;height:76px;flex:0 0 76px;align-items:center;justify-content:center;border-radius:22px;background:#edf3fc;color:#2563eb;margin-bottom:5px}.session-icon svg{width:39px;height:39px;display:block}.session-number{font-size:12px;font-weight:bold;letter-spacing:1px;color:#2563eb;text-transform:uppercase}.session-name{font-size:18px;line-height:1.35}.session-description{color:#607089;font-size:13px;line-height:1.5;font-weight:normal;max-width:280px}.message{background:white;border:1px dashed #c8d5e7;border-radius:12px;padding:25px;text-align:center;color:#52627a;line-height:1.8}.back-container{text-align:center;margin-top:35px}.back-button{display:inline-block;background:white;color:#1d4ed8;padding:13px 22px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;font-weight:bold;text-decoration:none}footer{background:white;border-top:1px solid #e0e8f3;padding:22px;text-align:center;color:#718096;font-size:13px;margin-top:40px}@media(max-width:700px){main{padding:28px 15px 40px}.page-heading h1{font-size:27px}.session-tile{padding:20px 14px;gap:8px}.session-icon{width:76px;height:76px;flex-basis:76px}.back-button{width:100%;max-width:340px}}
</style></head><body>
<header><h2>IGCSE English Hub</h2><p>Cambridge Checkpoint · Preparation Course</p></header>
<main><section class="page-heading"><h1>Explanation Videos</h1><p>Choose a session to open its video, PDF resources, and access details on a separate page.</p></section><div id="status" class="message">Loading published sessions...</div><div id="videoGrid" class="video-grid"></div><div class="back-container"><a class="back-button" href="preparation.html">← Back to Preparation Course</a></div></main>
<footer>© 2026 IGCSE English Hub — All Rights Reserved</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY="sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const statusBox=document.getElementById('status'),grid=document.getElementById('videoGrid');
async function load(){
 const {data:auth,error:authError}=await db.auth.getSession();
 if(authError||!auth?.session){statusBox.textContent='Please sign in to your student account before opening preparation videos.';return;}
 const {data:videos,error}=await db.from('preparation_videos').select('id,title,category,year_group,description,created_at').eq('is_published',true).order('created_at',{ascending:false});
 if(error){console.error(error);statusBox.textContent='We could not load the sessions. Please refresh or contact your teacher.';return;}
 if(!videos?.length){statusBox.textContent='No published sessions are available yet.';return;}
 statusBox.hidden=true;grid.replaceChildren();
 videos.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='session-tile';
 const icon=document.createElement('span');icon.className='session-icon';icon.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="currentColor" opacity=".12"></circle><path d="M26 19 L45 32 L26 45 Z" fill="currentColor"></path></svg>';
 const number=document.createElement('span');number.className='session-number';number.textContent='Session '+(i+1);
 const title=document.createElement('strong');title.className='session-name';title.textContent=v.title||('Session '+(i+1));
 const desc=document.createElement('span');desc.className='session-description';desc.textContent=v.description||'Open this session to view its learning content.';
 b.append(icon,number,title,desc);b.addEventListener('click',()=>{location.href='video-session.html?id='+encodeURIComponent(v.id)});grid.appendChild(b);
 });
}
load().catch(e=>{console.error(e);statusBox.textContent='An unexpected error occurred while loading sessions.'});
</script></body></html>
