<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Course | IGCSE English Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f8fe;color:#102a56}
header{background:#102f63;color:white;padding:22px 6%}
header h2{margin:0;font-size:22px}
header p{color:#dbeafe;margin:8px 0 0;font-size:14px}
main{max-width:1320px;margin:auto;padding:38px 28px 55px}
.page-heading{margin-bottom:34px;position:relative;padding-left:24px}
.page-heading:before{content:"";position:absolute;left:0;top:3px;width:6px;height:48px;border-radius:6px;background:#3478f6}
.page-heading h1{font-size:32px;color:#102f63;margin:0 0 12px}
.page-heading p{color:#60789e;line-height:1.7;margin:0;font-size:16px}
.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.session-tile{position:relative;width:100%;min-height:176px;padding:24px 56px 22px 34px;border:1px solid #dce7f6;border-left:6px solid var(--accent,#3478f6);border-radius:13px;background:rgba(255,255,255,.96);color:#102f63;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:12px;text-align:left;box-shadow:0 8px 22px rgba(28,66,117,.07);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.session-tile:hover{transform:translateY(-3px);box-shadow:0 13px 28px rgba(28,66,117,.12);border-color:#c9daf2;border-left-color:var(--accent,#3478f6)}
.session-number{display:inline-flex;align-items:center;align-self:flex-start;padding:6px 13px;border-radius:999px;background:var(--soft,#e7efff);color:var(--accent,#3478f6);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.session-name{font-size:18px;line-height:1.35;font-weight:700;padding-right:4px}
.session-description{color:#60789e;font-size:14px;line-height:1.55;font-weight:400;max-width:330px}
.session-arrow{position:absolute;right:24px;top:50%;transform:translateY(-50%);font-size:30px;line-height:1;color:#3478f6;font-weight:300}
.message{background:white;border:1px dashed #c8d5e7;border-radius:12px;padding:25px;text-align:center;color:#52627a;line-height:1.8}
.back-container{text-align:center;margin-top:34px}
.back-button{display:inline-block;background:white;color:#1760db;padding:14px 24px;border:1px solid #cbdaf0;border-radius:10px;font-size:15px;font-weight:bold;text-decoration:none;box-shadow:0 2px 4px rgba(16,47,99,.03)}
.back-button:hover{background:#f8fbff;border-color:#8fb4f4}
footer{background:white;border-top:1px solid #e0e8f3;padding:22px;text-align:center;color:#718096;font-size:13px;margin-top:40px}
@media(max-width:900px){main{padding:32px 22px 45px}.video-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.session-tile{min-height:165px;padding-left:25px}}
@media(max-width:600px){header{padding:20px 5%}main{padding:28px 15px 38px}.page-heading h1{font-size:27px}.page-heading p{font-size:14px}.video-grid{grid-template-columns:1fr;gap:14px}.session-tile{min-height:150px;padding:20px 48px 20px 22px}.session-name{font-size:17px}.session-arrow{right:18px}.back-button{width:100%;max-width:340px}}
</style></head><body>
<header><h2>IGCSE English Hub</h2><p>Cambridge Checkpoint · Preparation Course</p></header>
<main><section class="page-heading"><h1>Discover Course</h1><p>Choose a session to open its video, PDF resources, and access details on a separate page.</p></section><div id="status" class="message">Loading published sessions...</div><div id="videoGrid" class="video-grid"></div><div class="back-container"><a class="back-button" href="preparation.html">← Back to Preparation Course</a></div></main>
<footer>© 2026 IGCSE English Hub — All Rights Reserved</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY="sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const statusBox=document.getElementById('status'),grid=document.getElementById('videoGrid');
async function load(){
 const {data:auth,error:authError}=await db.auth.getSession();
 if(authError||!auth?.session){statusBox.textContent='Please sign in to your student account before opening preparation videos.';return;}
 const {data:videos,error}=await db.from('preparation_videos').select('id,title,category,year_group,description,created_at').eq('is_published',true).order('created_at',{ascending:false});
 if(error){console.error(error);statusBox.textContent='We could not load the sessions. Please refresh or contact your teacher.';return;}
 if(!videos?.length){statusBox.textContent='No published sessions are available yet.';return;}
 statusBox.hidden=true;grid.replaceChildren();
 const accents=[['#3478f6','#e7efff'],['#10b89b','#e0f7f2'],['#9557f6','#f0e8ff'],['#ff9500','#fff0dc'],['#08a9d1','#e0f7fc'],['#e94b9b','#fde7f2']];
 videos.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='session-tile';
 const [accent,soft]=accents[i%accents.length];b.style.setProperty('--accent',accent);b.style.setProperty('--soft',soft);
 const number=document.createElement('span');number.className='session-number';number.textContent='Session '+(i+1);
 const title=document.createElement('strong');title.className='session-name';title.textContent=v.title||('Session '+(i+1));
 const desc=document.createElement('span');desc.className='session-description';desc.textContent=v.description||'Open this session to view its learning content.';
 const arrow=document.createElement('span');arrow.className='session-arrow';arrow.setAttribute('aria-hidden','true');arrow.textContent='›';
 b.append(number,title,desc,arrow);b.addEventListener('click',()=>{location.href='video-session.html?id='+encodeURIComponent(v.id)});grid.appendChild(b);
 });
}
load().catch(e=>{console.error(e);statusBox.textContent='An unexpected error occurred while loading sessions.'});
</script></body></html>
