<script>
const SUPABASE_URL = "https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY = "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";
const CHAPTER_ID = 10;
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const gate=document.getElementById('activationGate'), host=document.getElementById('lessonHost'), statusBox=document.getElementById('status');
function showStatus(msg,ok=false){statusBox.textContent=msg;statusBox.style.color=ok?'#237044':'#b42318'}
async function loadChapter(silent=false){const {data,error}=await client.rpc('get_unlocked_content',{p_content_type:'chapter',p_content_id:CHAPTER_ID});if(error){if(!silent)showStatus('Could not load the chapter. Please check your activation and try again.');return false}let body='';if(typeof data==='string')body=data;else if(Array.isArray(data)&&data.length)body=data[0].body||Object.values(data[0])[0]||'';else if(data&&typeof data==='object')body=data.body||Object.values(data)[0]||'';if(!body){if(!silent)showStatus('The chapter content was not returned. Please contact your teacher.');return false}renderLesson(body);return true}
async function activateChapter(){const code=document.getElementById('activationCode').value.trim();if(!code){showStatus('Please enter your activation code.');return}document.getElementById('activateButton').disabled=true;showStatus('Checking code…');const {error}=await client.rpc('activate_content_code',{p_code:code});document.getElementById('activateButton').disabled=false;if(error){showStatus(error.message||'Activation failed. Check the code and try again.');return}showStatus('Code accepted. Opening chapter…',true);const loaded=await loadChapter();if(!loaded)showStatus('The code was accepted, but the chapter did not load. Please send your teacher a screenshot of this message.')}
function renderLesson(source){const parser=new DOMParser();const doc=parser.parseFromString(source,'text/html');const styleText=Array.from(doc.querySelectorAll('style')).map(s=>s.textContent).join('\n');if(styleText){const st=document.createElement('style');st.textContent=styleText;document.head.appendChild(st)}const innerNav=doc.querySelector('.lesson-nav');if(innerNav)innerNav.remove();const innerHeader=doc.querySelector('body > header');if(innerHeader)innerHeader.remove();const innerFooter=doc.querySelector('body > footer');if(innerFooter)innerFooter.remove();const originalContainer=doc.querySelector('body > .container');if(originalContainer){originalContainer.style.marginLeft='0';originalContainer.style.maxWidth='none';originalContainer.style.padding='0';host.innerHTML=originalContainer.innerHTML}else{host.innerHTML=doc.body.innerHTML}host.classList.remove('hidden');gate.classList.add('hidden');document.querySelectorAll('.lesson-nav a').forEach(a=>a.addEventListener('click',e=>{const target=host.querySelector(a.getAttribute('href'));if(target){e.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'})}}));host.querySelectorAll('script').forEach(old=>{const s=document.createElement('script');s.textContent=old.textContent;old.replaceWith(s)});if(typeof window.toggleAnswer!=='function'){window.toggleAnswer=function(id,button){const answer=document.getElementById(id);if(!answer)return;const open=answer.classList.toggle('show');button.textContent=open?'🙈 Hide Answer':'👁️ Show Answer'}};const sections=host.querySelectorAll('.section');const links=document.querySelectorAll('.lesson-nav a');window.addEventListener('scroll',()=>{let current='';sections.forEach(s=>{if(window.scrollY>=s.getBoundingClientRect().top+window.scrollY-150)current=s.id});links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+current))});}
// Check whether this student has already activated the chapter.
// If not, keep the activation form visible without showing an error.
loadChapter(true);
