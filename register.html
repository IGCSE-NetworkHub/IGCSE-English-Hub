<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | The Blueprint</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* Header */
header {
    background: #102a56;
    color: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #f4c542;
}

.back-link {
    color: white;
    text-decoration: none;
    font-size: 15px;
}

/* Registration */
.container {
    min-height: calc(100vh - 75px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 50px 20px;
}

.register-box {
    background: white;
    width: 100%;
    max-width: 520px;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.register-box h1 {
    text-align: center;
    color: #102a56;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #657084;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #d5dbe5;
    border-radius: 7px;
    font-size: 15px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #1f4b91;
}

button {
    width: 100%;
    padding: 14px;
    background: #f4c542;
    color: #172033;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.note {
    margin-top: 20px;
    padding: 15px;
    background: #f5f7fb;
    border-radius: 7px;
    font-size: 13px;
    color: #657084;
    line-height: 1.6;
}
</style>
</head>

<body>

<header>

    <div class="logo">
        THE <span>BLUEPRINT</span>
    </div>

    <a href="index.html" class="back-link">
        ← Home
    </a>

</header>


<div class="container">

    <div class="register-box">

        <h1>Student Registration</h1>

        <p class="subtitle">
            Join The Blueprint and start your English learning journey.
        </p>


        <form id="registrationForm">

            <div class="form-group">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student's full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="parentPhone">
                    Parent / Guardian WhatsApp
                </label>

                <input
                    type="tel"
                    id="parentPhone"
                    placeholder="Enter WhatsApp number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="grade">
                    Stage / Grade
                </label>

                <select id="grade" required>

                    <option value="">
                        Select your stage
                    </option>

                    <option value="Stage 4">
                        Stage 4
                    </option>

                    <option value="Stage 5">
                        Stage 5
                    </option>

                    <option value="Stage 6">
                        Stage 6
                    </option>

                    <option value="Stage 7">
                        Stage 7
                    </option>

                    <option value="Stage 8">
                        Stage 8
                    </option>

                    <option value="Stage 9">
                        Stage 9
                    </option>

                </select>

            </div>


            <button type="submit">
                Register
            </button>

        </form>
<p id="registrationMessage" style="text-align:center; margin-top:15px;"></p>

        <div class="note">

            After submitting your registration, you will receive
            a registration code from The Blueprint to activate
            your student account.

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://knazqfrjzgkqavnhzjwq.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const registrationForm = document.getElementById("registrationForm");
const registrationMessage = document.getElementById("registrationMessage");

registrationForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const studentName = document.getElementById("studentName").value.trim();
    const parentPhone = document.getElementById("parentPhone").value.trim();
    const email = document.getElementById("email").value.trim();
    const grade = document.getElementById("grade").value;

    registrationMessage.textContent = "Processing registration...";

    const { data, error } = await supabaseClient
        .from("students")
        .insert([
            {
                student_name: studentName,
                parent_phone: parentPhone,
                email: email,
                grade: grade
            }
        ])
        .select();

    if (error) {

        console.error(error);

        registrationMessage.textContent =
            "Registration failed. Please try again.";

        registrationMessage.style.color = "red";

        return;
    }

    registrationMessage.textContent =
        "Registration submitted successfully!";

    registrationMessage.style.color = "green";

    registrationForm.reset();

});

</script>
</body>
</html>
