
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Marking | IGCSE English Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6fa;
    color: #202938;
}

header {
    background: #172554;
    color: white;
    padding: 24px;
}

header h1 { margin: 0 0 8px; }
header p { margin: 0; color: #dbeafe; }

main {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 16px 40px;
}

.panel, .submission {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 22px;
    margin-bottom: 20px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0;
}

select, input, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font: inherit;
}

.toolbar select { width: auto; min-width: 210px; }

button {
    border: 0;
    border-radius: 7px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled { opacity: .6; cursor: wait; }

.primary { background: #1d4ed8; color: white; }
.success { background: #15803d; color: white; }
.secondary { background: #e2e8f0; color: #172554; }

.muted { color: #64748b; }
.error { color: #b91c1c; }
.success-text { color: #15803d; }

.student-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 6px;
}

.student-meta {
    color: #64748b;
    font-size: 14px;
    line-height: 1.7;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #fef3c7;
    color: #92400e;
}

.badge.approved {
    background: #dcfce7;
    color: #166534;
}

.question {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    padding: 17px;
    margin: 14px 0;
}

.question-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.question-text {
    line-height: 1.6;
    margin-bottom: 14px;
}

.options-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 12px 0;
}

.option {
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    background: white;
    border-radius: 7px;
}

.option.correct {
    background: #f0fdf4;
    border-color: #86efac;
    color: #166534;
    font-weight: bold;
}

.answer-box {
    margin-top: 8px;
    padding: 12px;
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 7px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.answer-correct {
    color: #166534;
    font-weight: bold;
}

.field {
    margin: 20px 0;
    width: 100%;
}

.field label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

textarea {
    display: block;
    width: 100%;
    min-height: 130px;
    resize: vertical;
    line-height: 1.5;
}

.score-input {
    max-width: 100%;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 22px;
}

hr {
    border: 0;
    border-top: 1px solid #e2e8f0;
    margin: 22px 0;
}

footer {
    text-align: center;
    padding: 22px;
    color: #64748b;
    font-size: 13px;
}

@media (max-width: 600px) {
    .toolbar select { width: 100%; }
    .panel, .submission { padding: 16px; }
    .actions button { width: 100%; }
}
</style>
</head>

<body>
<header>
    <h1>Teacher Marking</h1>
    <p>Review student submissions, award marks, and approve results.</p>
</header>

<main>
    <section class="panel">
        <div id="pageMessage">Checking teacher access...</div>

        <div class="toolbar">
            <select id="filter">
                <option value="all">All submitted attempts</option>
                <option value="pending">Awaiting approval</option>
                <option value="approved">Approved results</option>
            </select>

            <button class="primary" id="refreshButton" type="button">
                Refresh
            </button>
        </div>

        <div id="submissionList"></div>
    </section>

    <section id="detailsPanel" class="panel" hidden>
        <div id="submissionDetails"></div>
    </section>
</main>

<footer>© 2026 IGCSE English Hub — All Rights Reserved</footer>

<script>
const SUPABASE_URL = "https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY = "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const pageMessage = document.getElementById("pageMessage");
const submissionList = document.getElementById("submissionList");
const detailsPanel = document.getElementById("detailsPanel");
const submissionDetails = document.getElementById("submissionDetails");
const filterSelect = document.getElementById("filter");

let submissions = [];
let testsById = {};
let questionsByTest = {};
let studentsByUserId = {};
let selectedSubmissionId = null;

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function showMessage(message, isError = false) {
    pageMessage.className = isError ? "error" : "";
    pageMessage.textContent = message;
}

function formatDate(value) {
    if (!value) return "Not available";

    const date = new Date(value);

    return Number.isNaN(date.getTime())
        ? "Not available"
        : date.toLocaleString();
}

function isApproved(submission) {
    return Boolean(submission.approved_at);
}

function getTest(submission) {
    return testsById[String(submission.test_id)] || {};
}

function getStudent(submission) {
    return studentsByUserId[String(submission.student_user_id)] || null;
}

function studentName(submission) {
    const student = getStudent(submission);

    if (!student) {
        return "Student name unavailable";
    }

    return student.student_name || student.username || "Unnamed student";
}

function studentDetailsHtml(submission) {
    const student = getStudent(submission);

    if (!student) {
        return `
            <div class="student-name">Student name unavailable</div>
            <div class="student-meta">
                Account ID: ${escapeHtml(submission.student_user_id || "Unknown")}<br>
                The account could not be matched to a student record.
            </div>`;
    }

    return `
        <div class="student-name">${escapeHtml(student.student_name || "Unnamed student")}</div>
        <div class="student-meta">
            Username: ${escapeHtml(student.username || "Not specified")}<br>
            Grade: ${escapeHtml(student.grade || "Not specified")}<br>
            Email: ${escapeHtml(student.email || "Not specified")}
        </div>`;
}

async function checkTeacherAccess() {
    const { data: sessionData, error: sessionError } =
        await db.auth.getSession();

    if (sessionError) throw sessionError;

    const user = sessionData.session?.user;

    if (!user) {
        showMessage("Please log in with your teacher account.", true);
        submissionList.innerHTML =
            '<p><a href="login.html">Go to login</a></p>';
        return false;
    }

    const { data: roles, error: roleError } = await db
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .eq("role", "teacher")
        .limit(1);

    if (roleError) throw roleError;

    if (!roles || roles.length === 0) {
        showMessage("Access denied. This page is for teacher accounts only.", true);
        return false;
    }

    showMessage("Teacher access confirmed.");
    return true;
}

function normalizeOptions(value) {
    if (value === null || value === undefined || value === "") {
        return { options: [], explanation: "" };
    }

    let parsed = value;

    if (typeof parsed === "string") {
        try {
            parsed = JSON.parse(parsed);
        } catch (_) {
            return { options: [], explanation: "" };
        }
    }

    if (Array.isArray(parsed)) {
        return { options: parsed, explanation: "" };
    }

    if (typeof parsed === "object") {
        return {
            options: Array.isArray(parsed.options) ? parsed.options : [],
            explanation: parsed.explanation || ""
        };
    }

    return { options: [], explanation: "" };
}

async function loadData() {
    showMessage("Loading submissions...");
    submissionList.innerHTML = "";
    detailsPanel.hidden = true;

    const { data: testRows, error: testsError } = await db
        .from("unit_tests")
        .select("id, title, total_marks, require_teacher_approval");

    if (testsError) throw testsError;

    testsById = {};

    (testRows || []).forEach(test => {
        testsById[String(test.id)] = test;
    });

    const { data: rows, error: submissionsError } = await db
        .from("test_submissions")
        .select("*")
        .neq("status", "in_progress")
        .order("submitted_at", { ascending: false });

    if (submissionsError) throw submissionsError;

    submissions = rows || [];

    // Load student identity details using the user_id mapping.
    studentsByUserId = {};

    const userIds = [
        ...new Set(
            submissions
                .map(row => row.student_user_id)
                .filter(Boolean)
        )
    ];

    if (userIds.length > 0) {
        const { data: studentRows, error: studentsError } = await db
            .from("students")
            .select("user_id, student_name, username, grade, email")
            .in("user_id", userIds);

        if (studentsError) {
            console.error("Could not load student details:", studentsError);
        } else {
            (studentRows || []).forEach(student => {
                if (student.user_id) {
                    studentsByUserId[String(student.user_id)] = student;
                }
            });
        }
    }

    const testIds = [
        ...new Set(submissions.map(row => row.test_id))
    ];

    questionsByTest = {};

    if (testIds.length > 0) {
        const { data: questionRows, error: questionsError } = await db
            .from("unit_test_questions")
            .select("id, test_id, question_text, question_type, options, correct_answer, marks, sort_order")
            .in("test_id", testIds)
            .order("sort_order", { ascending: true });

        if (questionsError) throw questionsError;

        (questionRows || []).forEach(question => {
            const key = String(question.test_id);

            if (!questionsByTest[key]) {
                questionsByTest[key] = [];
            }

            questionsByTest[key].push(question);
        });
    }

    showMessage("Loaded " + submissions.length + " submitted attempt(s).");
    renderSubmissions();
}

function renderSubmissions() {
    const filter = filterSelect.value;

    const visible = submissions.filter(submission => {
        if (filter === "pending") return !isApproved(submission);
        if (filter === "approved") return isApproved(submission);
        return true;
    });

    if (visible.length === 0) {
        submissionList.innerHTML =
            '<p class="muted">No submissions in this category.</p>';
        return;
    }

    submissionList.innerHTML = visible.map(submission => {
        const test = getTest(submission);
        const approved = isApproved(submission);

        const status = approved
            ? '<span class="badge approved">Approved</span>'
            : '<span class="badge">Awaiting approval</span>';

        const score = submission.teacher_score !== null
            ? submission.teacher_score
            : "Not marked";

        return `
            <article class="submission">
                <h3>${escapeHtml(test.title || ("Test #" + submission.test_id))}</h3>

                ${studentDetailsHtml(submission)}

                <hr>

                <p>Submission #${escapeHtml(submission.id)}</p>
                <p>Attempt: ${escapeHtml(submission.attempt_number ?? 1)}</p>
                <p>Submitted: ${escapeHtml(formatDate(submission.submitted_at))}</p>
                <p>Teacher score: ${escapeHtml(score)} / ${escapeHtml(test.total_marks ?? "—")}</p>
                <p>${status}</p>

                <button class="primary" type="button"
                    data-open="${escapeHtml(submission.id)}">
                    Review submission
                </button>
            </article>`;
    }).join("");

    submissionList.querySelectorAll("[data-open]").forEach(button => {
        button.addEventListener("click", () => {
            openSubmission(Number(button.dataset.open));
        });
    });
}

function displayAnswer(value) {
    if (value === undefined || value === null || value === "") {
        return "No answer submitted";
    }

    if (typeof value === "object") {
        return JSON.stringify(value, null, 2);
    }

    return String(value);
}

function normalizeAnswer(value) {
    return String(value ?? "").trim().toLowerCase();
}

function renderOptions(question, studentAnswer) {
    const normalized = normalizeOptions(question.options);
    const options = normalized.options;

    if (!options.length) {
        return "";
    }

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const optionsHtml = options.map((option, index) => {
        let optionText = option;

        if (option && typeof option === "object") {
            optionText =
                option.text ??
                option.label ??
                option.value ??
                JSON.stringify(option);
        }

        const letter = letters[index] || String(index + 1);
        const isCorrect =
            normalizeAnswer(optionText) === normalizeAnswer(question.correct_answer);

        const isStudentAnswer =
            normalizeAnswer(optionText) === normalizeAnswer(studentAnswer);

        let classes = "option";

        if (isCorrect) classes += " correct";

        let label = letter + ". " + String(optionText);

        if (isCorrect) label += " — Correct answer";
        if (isStudentAnswer) label += " — Student's choice";

        return `
            <div class="${classes}">
                ${escapeHtml(label)}
            </div>`;
    }).join("");

    return `
        <div class="options-list">
            ${optionsHtml}
        </div>`;
}

function renderQuestion(question, submission) {
    const answers = submission.answers || {};

    const answer =
        answers[String(question.id)] ??
        answers[question.id];

    const feedbackRows = Array.isArray(submission.auto_feedback)
        ? submission.auto_feedback
        : [];

    const feedback = feedbackRows.find(item =>
        String(item.question_id) === String(question.id)
    );

    const optionsHtml = renderOptions(question, answer);

    let feedbackHtml = "";

    if (feedback) {
        let markingText = "Reviewed";

        if (feedback.correct === true) markingText = "Correct";
        if (feedback.correct === false) markingText = "Incorrect";

        feedbackHtml = `
            <p><strong>Automatic marking:</strong>
                ${escapeHtml(markingText)}
                ${feedback.marks !== undefined
                    ? " · " + escapeHtml(feedback.marks) + " mark(s)"
                    : ""}
            </p>`;
    }

    return `
        <div class="question">
            <div class="question-title">
                Question ${escapeHtml(question.sort_order ?? question.id)}
            </div>

            <div class="question-text">
                ${escapeHtml(question.question_text)}
            </div>

            ${optionsHtml}

            <p><strong>Student answer:</strong></p>
            <div class="answer-box">${escapeHtml(displayAnswer(answer))}</div>

            <p><strong>Expected answer:</strong>
                <span class="answer-correct">
                    ${escapeHtml(question.correct_answer ?? "Not provided")}
                </span>
            </p>

            <p><strong>Available marks:</strong> ${escapeHtml(question.marks ?? 0)}</p>

            ${feedbackHtml}
        </div>`;
}

function formatUploadedFiles(value) {
    if (value === null || value === undefined || value === "") {
        return "No files uploaded.";
    }

    let parsed = value;

    if (typeof parsed === "string") {
        try {
            parsed = JSON.parse(parsed);
        } catch (_) {
            return String(parsed);
        }
    }

    if (Array.isArray(parsed) && parsed.length === 0) {
        return "No files uploaded.";
    }

    return displayAnswer(parsed);
}

function openSubmission(id) {
    const submission = submissions.find(row => Number(row.id) === id);

    if (!submission) return;

    selectedSubmissionId = id;

    const test = getTest(submission);
    const questions = questionsByTest[String(submission.test_id)] || [];
    const totalMarks = Number(test.total_marks ?? 0);

    const approved = isApproved(submission);

    const questionsHtml = questions.length
        ? questions.map(question => renderQuestion(question, submission)).join("")
        : '<p class="muted">No questions were found for this test.</p>';

    submissionDetails.innerHTML = `
        <h2>${escapeHtml(test.title || ("Test #" + submission.test_id))}</h2>

        ${studentDetailsHtml(submission)}

        <hr>

        <p><strong>Submission ID:</strong> #${escapeHtml(submission.id)}</p>
        <p><strong>Submitted:</strong> ${escapeHtml(formatDate(submission.submitted_at))}</p>
        <p><strong>Status:</strong> ${escapeHtml(submission.status || "Unknown")}</p>
        <p><strong>Automatic score:</strong>
            ${escapeHtml(submission.auto_score ?? "Not available")}
            / ${escapeHtml(totalMarks)}
        </p>

        <p><strong>Approval:</strong>
            ${approved
                ? '<span class="badge approved">Approved</span>'
                : '<span class="badge">Awaiting teacher review</span>'}
        </p>

        <hr>

        <h3>Answers and marking details</h3>
        ${questionsHtml}

        ${submission.writing_text ? `
            <h3>Student writing</h3>
            <div class="answer-box">${escapeHtml(submission.writing_text)}</div>
        ` : ""}

        <h3>Uploaded files</h3>
        <div class="answer-box">${escapeHtml(formatUploadedFiles(submission.uploaded_file_paths))}</div>

        <hr>

        <h3>Teacher's assessment</h3>

        <div class="field">
            <label for="teacherScore">
                Teacher score (out of ${escapeHtml(totalMarks)})
            </label>
            <input
                class="score-input"
                id="teacherScore"
                type="number"
                min="0"
                max="${escapeHtml(totalMarks)}"
                step="0.25"
                value="${submission.teacher_score === null
                    ? ""
                    : escapeHtml(submission.teacher_score)}"
            >
        </div>

        <div class="field">
            <label for="teacherFeedback">Teacher feedback</label>
            <textarea id="teacherFeedback"
                placeholder="Write feedback for the student...">${escapeHtml(submission.teacher_feedback || "")}</textarea>
        </div>

        <div class="actions">
            <button class="success" id="approveButton" type="button">
                Save and approve result
            </button>

            <button class="primary" id="saveButton" type="button">
                Save without approval
            </button>

            <button class="secondary" id="closeButton" type="button">
                Close
            </button>
        </div>

        <p id="saveMessage" role="status"></p>
    `;

    detailsPanel.hidden = false;

    document.getElementById("saveButton")
        .addEventListener("click", () => saveSubmission(false));

    document.getElementById("approveButton")
        .addEventListener("click", () => saveSubmission(true));

    document.getElementById("closeButton")
        .addEventListener("click", () => {
            detailsPanel.hidden = true;
            selectedSubmissionId = null;
        });

    detailsPanel.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

async function saveSubmission(approve) {
    if (selectedSubmissionId === null) return;

    const submissionId = selectedSubmissionId;

    const submission = submissions.find(
        row => Number(row.id) === submissionId
    );

    if (!submission) return;

    const test = getTest(submission);
    const totalMarks = Number(test.total_marks ?? 0);

    const scoreInput = document.getElementById("teacherScore");
    const feedbackInput = document.getElementById("teacherFeedback");
    const message = document.getElementById("saveMessage");

    const saveButton = document.getElementById("saveButton");
    const approveButton = document.getElementById("approveButton");

    const scoreText = scoreInput.value.trim();
    const score = Number(scoreText);

    if (
        scoreText === "" ||
        !Number.isFinite(score) ||
        score < 0 ||
        score > totalMarks
    ) {
        message.className = "error";
        message.textContent =
            "Enter a valid score between 0 and " + totalMarks + ".";
        return;
    }

    saveButton.disabled = true;
    approveButton.disabled = true;

    message.className = "";
    message.textContent = "Saving...";

    const updateData = {
        teacher_score: score,
        teacher_feedback: feedbackInput.value.trim()
    };

    if (approve) {
        updateData.approved_at = new Date().toISOString();
    }

    try {
        const { data: sessionData, error: sessionError } =
            await db.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
            throw new Error("Your session has expired. Please log in again.");
        }

        const { data: updatedRows, error: updateError } = await db
            .from("test_submissions")
            .update(updateData)
            .eq("id", submissionId)
            .select("id");

        if (updateError) throw updateError;

        if (!updatedRows || updatedRows.length === 0) {
            throw new Error("No submission was updated. Check teacher permissions.");
        }

        await loadData();

        const updatedSubmission = submissions.find(
            row => Number(row.id) === submissionId
        );

        if (updatedSubmission) {
            openSubmission(submissionId);

            const refreshedMessage = document.getElementById("saveMessage");

            if (refreshedMessage) {
                refreshedMessage.className = "success-text";
                refreshedMessage.textContent = approve
                    ? "Score saved and result approved."
                    : "Score and feedback saved.";
            }
        } else {
            detailsPanel.hidden = true;
            showMessage("Submission saved successfully.");
        }
    } catch (error) {
        message.className = "error";
        message.textContent =
            "Could not save: " + (error.message || "Unknown error");
    } finally {
        const currentSaveButton = document.getElementById("saveButton");
        const currentApproveButton = document.getElementById("approveButton");

        if (currentSaveButton) currentSaveButton.disabled = false;
        if (currentApproveButton) currentApproveButton.disabled = false;
    }
}

document.getElementById("refreshButton").addEventListener("click", async () => {
    try {
        await loadData();
    } catch (error) {
        showMessage(
            "Could not load data: " + (error.message || "Unknown error"),
            true
        );
    }
});

filterSelect.addEventListener("change", renderSubmissions);

(async function init() {
    try {
        const allowed = await checkTeacherAccess();

        if (!allowed) return;

        await loadData();
    } catch (error) {
        showMessage(
            "Page error: " + (error.message || "Unknown error"),
            true
        );
    }
})();
</script>
</body>
</html>
