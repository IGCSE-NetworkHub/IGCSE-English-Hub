
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Marking | IGCSE English Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6fa;
    color: #202938;
}

header {
    background: #172554;
    color: white;
    padding: 24px;
}

header h1 { margin: 0 0 8px; }
header p { margin: 0; color: #dbeafe; }

main {
    max-width: 1150px;
    margin: 25px auto;
    padding: 0 16px 35px;
}

.panel, .submission {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 18px;
}

select, input, textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font: inherit;
}

.toolbar select { width: auto; min-width: 180px; }

button {
    border: 0;
    border-radius: 7px;
    padding: 11px 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary { background: #1d4ed8; color: white; }
.success { background: #15803d; color: white; }
.secondary { background: #e2e8f0; color: #172554; }

button:disabled { opacity: .6; cursor: wait; }

.muted { color: #64748b; }
.error { color: #b91c1c; }
.success-text { color: #15803d; }

.question {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 14px;
    margin: 12px 0;
}

.answer {
    margin-top: 8px;
    padding: 10px;
    background: white;
    border-radius: 6px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #fef3c7;
    color: #92400e;
}

.badge.approved {
    background: #dcfce7;
    color: #166534;
}

.field { margin: 14px 0; }
.field label { display: block; font-weight: bold; margin-bottom: 7px; }

.score-row {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 16px;
}

.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

@media (max-width: 600px) {
    .score-row { grid-template-columns: 1fr; }
    .toolbar select { width: 100%; }
}
</style>
</head>

<body>
<header>
    <h1>Teacher Marking</h1>
    <p>Review student submissions, award marks, and approve results.</p>
</header>

<main>
    <section class="panel">
        <div id="pageMessage">Checking teacher access...</div>
        <div class="toolbar">
            <select id="filter">
                <option value="all">All submitted attempts</option>
                <option value="pending">Awaiting approval</option>
                <option value="approved">Approved results</option>
            </select>
            <button class="primary" id="refreshButton" type="button">Refresh</button>
        </div>
        <div id="submissionList"></div>
    </section>

    <section id="detailsPanel" class="panel" hidden>
        <div id="submissionDetails"></div>
    </section>
</main>

<script>
const SUPABASE_URL = "https://knazqfrjzgkqavnhzjwq.supabase.co";
const SUPABASE_KEY = "sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const pageMessage = document.getElementById("pageMessage");
const submissionList = document.getElementById("submissionList");
const detailsPanel = document.getElementById("detailsPanel");
const submissionDetails = document.getElementById("submissionDetails");
const filterSelect = document.getElementById("filter");

let submissions = [];
let testsById = {};
let questionsByTest = {};
let selectedSubmissionId = null;

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[character]);
}

function showMessage(message, isError = false) {
    pageMessage.className = isError ? "error" : "";
    pageMessage.textContent = message;
}

function formatDate(value) {
    if (!value) return "Not available";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "Not available" : date.toLocaleString();
}

function studentLabel(submission) {
    const id = submission.student_user_id || "Unknown";
    return "Student account: " + id;
}

function isApproved(submission) {
    return Boolean(submission.approved_at);
}

function getTest(submission) {
    return testsById[String(submission.test_id)] || {};
}

async function checkTeacherAccess() {
    const { data: sessionData, error: sessionError } = await db.auth.getSession();

    if (sessionError) throw sessionError;

    const user = sessionData.session?.user;

    if (!user) {
        showMessage("Please log in with your teacher account.", true);
        submissionList.innerHTML =
            '<p><a href="login.html">Go to login</a></p>';
        return false;
    }

    const { data: roles, error: roleError } = await db
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .eq("role", "teacher")
        .limit(1);

    if (roleError) throw roleError;

    if (!roles || roles.length === 0) {
        showMessage("Access denied. This page is for teacher accounts only.", true);
        return false;
    }

    showMessage("Teacher access confirmed.");
    return true;
}

async function loadData() {
    showMessage("Loading submissions...");
    submissionList.innerHTML = "";
    detailsPanel.hidden = true;

    const { data: testRows, error: testsError } = await db
        .from("unit_tests")
        .select("id, title, total_marks, require_teacher_approval");

    if (testsError) throw testsError;

    testsById = {};
    (testRows || []).forEach(test => {
        testsById[String(test.id)] = test;
    });

    const { data: rows, error: submissionsError } = await db
        .from("test_submissions")
        .select("*")
        .neq("status", "in_progress")
        .order("submitted_at", { ascending: false });

    if (submissionsError) throw submissionsError;

    submissions = rows || [];

    const testIds = [...new Set(submissions.map(row => row.test_id))];

    questionsByTest = {};

    if (testIds.length) {
        const { data: questionRows, error: questionsError } = await db
            .from("unit_test_questions")
            .select("id, test_id, question_text, question_type, options, correct_answer, marks, sort_order")
            .in("test_id", testIds)
            .order("sort_order", { ascending: true });

        if (questionsError) throw questionsError;

        (questionRows || []).forEach(question => {
            const key = String(question.test_id);
            if (!questionsByTest[key]) questionsByTest[key] = [];
            questionsByTest[key].push(question);
        });
    }

    showMessage("Loaded " + submissions.length + " submitted attempt(s).");
    renderSubmissions();
}

function renderSubmissions() {
    const filter = filterSelect.value;

    const visible = submissions.filter(submission => {
        if (filter === "pending") return !isApproved(submission);
        if (filter === "approved") return isApproved(submission);
        return true;
    });

    if (!visible.length) {
        submissionList.innerHTML = '<p class="muted">No submissions in this category.</p>';
        return;
    }

    submissionList.innerHTML = visible.map(submission => {
        const test = getTest(submission);
        const approved = isApproved(submission);

        const status = approved
            ? '<span class="badge approved">Approved</span>'
            : '<span class="badge">Awaiting approval</span>';

        const title = test.title || ("Test #" + submission.test_id);
        const score = submission.teacher_score !== null
            ? submission.teacher_score
            : "Not marked";
        const total = test.total_marks ?? "—";

        return `
            <article class="submission">
                <h3>${escapeHtml(title)}</h3>
                <p>${escapeHtml(studentLabel(submission))}</p>
                <p>Submission #${escapeHtml(submission.id)} · Attempt ${escapeHtml(submission.attempt_number ?? 1)}</p>
                <p>Submitted: ${escapeHtml(formatDate(submission.submitted_at))}</p>
                <p>Teacher score: ${escapeHtml(score)} / ${escapeHtml(total)}</p>
                <p>${status}</p>
                <button class="primary" type="button"
                    data-open="${escapeHtml(submission.id)}">Review submission</button>
            </article>`;
    }).join("");

    submissionList.querySelectorAll("[data-open]").forEach(button => {
        button.addEventListener("click", () => {
            openSubmission(Number(button.dataset.open));
        });
    });
}

function displayAnswer(value) {
    if (value === undefined || value === null || value === "") return "No answer submitted";
    if (typeof value === "object") return JSON.stringify(value, null, 2);
    return String(value);
}

function renderQuestion(question, submission) {
    const answers = submission.answers || {};
    const answer = answers[String(question.id)] ?? answers[question.id];
    const feedbackRows = Array.isArray(submission.auto_feedback)
        ? submission.auto_feedback
        : [];

    const feedback = feedbackRows.find(item =>
        String(item.question_id) === String(question.id)
    );

    let optionsHtml = "";
    if (question.options) {
        let options = question.options;

        if (typeof options === "string") {
            try { options = JSON.parse(options); } catch (_) {}
        }

        if (Array.isArray(options)) {
            optionsHtml = "<ul>" + options.map(option =>
                "<li>" + escapeHtml(typeof option === "object"
                    ? JSON.stringify(option)
                    : option) + "</li>"
            ).join("") + "</ul>";
        } else if (typeof options === "object") {
            optionsHtml = "<pre>" + escapeHtml(JSON.stringify(options, null, 2)) + "</pre>";
        }
    }

    return `
        <div class="question">
            <strong>Question ${escapeHtml(question.sort_order ?? question.id)}</strong>
            <p>${escapeHtml(question.question_text)}</p>
            ${optionsHtml}
            <p><strong>Student answer:</strong></p>
            <div class="answer">${escapeHtml(displayAnswer(answer))}</div>
            <p><strong>Correct answer:</strong>
                ${escapeHtml(question.correct_answer ?? "Not provided")}</p>
            <p><strong>Available marks:</strong> ${escapeHtml(question.marks ?? 0)}</p>
            ${feedback ? `<p><strong>Automatic marking:</strong>
                ${feedback.correct === true ? "Correct" : feedback.correct === false ? "Incorrect" : "Reviewed"}
                ${feedback.marks !== undefined ? " · " + escapeHtml(feedback.marks) + " mark(s)" : ""}
            </p>` : ""}
        </div>`;
}

function openSubmission(id) {
    const submission = submissions.find(row => Number(row.id) === id);
    if (!submission) return;

    selectedSubmissionId = id;

    const test = getTest(submission);
    const questions = questionsByTest[String(submission.test_id)] || [];
    const totalMarks = Number(test.total_marks ?? 0);
    const approved = isApproved(submission);

    const questionsHtml = questions.length
        ? questions.map(question => renderQuestion(question, submission)).join("")
        : '<p class="muted">No questions were found for this test.</p>';

    submissionDetails.innerHTML = `
        <h2>${escapeHtml(test.title || ("Test #" + submission.test_id))}</h2>
        <p><strong>${escapeHtml(studentLabel(submission))}</strong></p>
        <p>Submission #${escapeHtml(submission.id)}</p>
        <p>Submitted: ${escapeHtml(formatDate(submission.submitted_at))}</p>
        <p>Status: ${escapeHtml(submission.status || "Unknown")}</p>
        <p>Automatic score: ${escapeHtml(submission.auto_score ?? "Not available")} / ${escapeHtml(totalMarks)}</p>
        <p>Approval: ${approved ? '<span class="badge approved">Approved</span>' : '<span class="badge">Not approved</span>'}</p>
        <hr>
        <h3>Answers and marking guide</h3>
        ${questionsHtml}
        ${submission.writing_text ? `
            <h3>Student writing</h3>
            <div class="answer">${escapeHtml(submission.writing_text)}</div>
        ` : ""}
        ${submission.uploaded_file_paths ? `
            <h3>Uploaded files</h3>
            <div class="answer">${escapeHtml(displayAnswer(submission.uploaded_file_paths))}</div>
        ` : ""}
        <div class="score-row">
            <div class="field">
                <label for="teacherScore">Teacher score (out of ${escapeHtml(totalMarks)})</label>
                <input id="teacherScore" type="number" min="0" max="${escapeHtml(totalMarks)}" step="0.25"
                    value="${submission.teacher_score === null ? "" : escapeHtml(submission.teacher_score)}">
            </div>
            <div class="field">
                <label for="teacherFeedback">Teacher feedback</label>
                <textarea id="teacherFeedback" rows="4">${escapeHtml(submission.teacher_feedback || "")}</textarea>
            </div>
        </div>
        <div class="actions">
            <button class="primary" id="saveButton" type="button">Save score and feedback</button>
            <button class="success" id="approveButton" type="button">Save and approve result</button>
            <button class="secondary" id="closeButton" type="button">Close</button>
        </div>
        <p id="saveMessage" role="status"></p>`;

    detailsPanel.hidden = false;
    document.getElementById("saveButton").addEventListener("click", () => saveSubmission(false));
    document.getElementById("approveButton").addEventListener("click", () => saveSubmission(true));
    document.getElementById("closeButton").addEventListener("click", () => {
        detailsPanel.hidden = true;
        selectedSubmissionId = null;
    });

    detailsPanel.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function saveSubmission(approve) {
    if (selectedSubmissionId === null) return;

    const submission = submissions.find(row => Number(row.id) === selectedSubmissionId);
    if (!submission) return;

    const test = getTest(submission);
    const totalMarks = Number(test.total_marks ?? 0);
    const scoreInput = document.getElementById("teacherScore");
    const feedbackInput = document.getElementById("teacherFeedback");
    const message = document.getElementById("saveMessage");
    const saveButton = document.getElementById("saveButton");
    const approveButton = document.getElementById("approveButton");

    const scoreText = scoreInput.value.trim();
    const score = Number(scoreText);

    if (scoreText === "" || !Number.isFinite(score) || score < 0 || score > totalMarks) {
        message.className = "error";
        message.textContent = "Enter a valid score between 0 and " + totalMarks + ".";
        return;
    }

    saveButton.disabled = true;
    approveButton.disabled = true;
    message.className = "";
    message.textContent = "Saving...";

    const updateData = {
        teacher_score: score,
        teacher_feedback: feedbackInput.value.trim()
    };

    if (approve) {
        updateData.approved_at = new Date().toISOString();
    }

    try {
        const { error } = await db
            .from("test_submissions")
            .update(updateData)
            .eq("id", selectedSubmissionId);

        if (error) throw error;

        message.className = "success-text";
        message.textContent = approve
            ? "Score saved and result approved."
            : "Score and feedback saved.";

        await loadData();

        const updatedSubmission = submissions.find(row =>
            Number(row.id) === selectedSubmissionId
        );

        if (updatedSubmission) {
            openSubmission(Number(updatedSubmission.id));
            const refreshedMessage = document.getElementById("saveMessage");
            if (refreshedMessage) {
                refreshedMessage.className = "success-text";
                refreshedMessage.textContent = approve
                    ? "Score saved and result approved."
                    : "Score and feedback saved.";
            }
        } else {
            detailsPanel.hidden = true;
        }
    } catch (error) {
        message.className = "error";
        message.textContent = "Could not save: " + (error.message || "Unknown error");
    } finally {
        saveButton.disabled = false;
        approveButton.disabled = false;
    }
}

document.getElementById("refreshButton").addEventListener("click", async () => {
    try {
        await loadData();
    } catch (error) {
        showMessage("Could not load data: " + (error.message || "Unknown error"), true);
    }
});

filterSelect.addEventListener("change", renderSubmissions);

(async function init() {
    try {
        const allowed = await checkTeacherAccess();
        if (!allowed) return;
        await loadData();
    } catch (error) {
        showMessage("Page error: " + (error.message || "Unknown error"), true);
    }
})();
</script>
</body>
</html>
