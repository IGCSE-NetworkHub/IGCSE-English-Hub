<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fc;color:#172554}header{background:#102a56;color:white;padding:22px 6%}header h2{margin:0;font-size:22px}header p{color:#dbeafe;margin:8px 0 0;font-size:14px}main{max-width:1320px;margin:auto;padding:32px 18px 55px}.panel{background:white;border:1px solid #e0e8f3;border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:0 6px 20px #102a560c}h1{margin:0 0 12px;color:#102a56;font-size:30px}h2{font-size:21px;color:#102a56}.description{color:#607089;line-height:1.75;white-space:pre-wrap}.video-frame{width:100%;aspect-ratio:16/9;border:0;display:block;background:#0f172a;border-radius:12px;margin:18px 0}.message{background:#f8fafc;border:1px dashed #c8d5e7;border-radius:12px;padding:18px;text-align:center;color:#52627a;line-height:1.7}.access-panel{margin-top:16px;padding:18px;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc}.access-panel label{display:block;font-weight:bold;margin:12px 0 8px;color:#102a56}.access-panel input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px;font-size:15px}.actions{display:flex;flex-wrap:wrap;gap:9px}.actions button,.resource-link{display:inline-block;border:0;border-radius:8px;padding:12px 16px;background:#1d4ed8;color:white;font-weight:bold;text-decoration:none;cursor:pointer}.actions button.secondary{background:#475569}.actions button:disabled{opacity:.55;cursor:wait}.access-message{margin:12px 0 0!important;font-size:14px;line-height:1.6}.error{color:#b91c1c}.success{color:#166534}.resources{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.back{display:inline-block;margin-bottom:18px;color:#1d4ed8;font-weight:bold;text-decoration:none}.session-layout{display:grid;grid-template-columns:minmax(0,2.25fr) minmax(285px,.85fr);gap:18px;align-items:start}.session-layout .panel{margin-bottom:18px}.side-panel{min-width:0}.side-panel h2{margin-top:0}.side-resources{border-top:1px solid #e5edf7;margin-top:18px;padding-top:16px}.side-resources>strong{display:block;color:#102a56;margin-bottom:10px}.counter-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:4px 0 18px}.counter-card{min-width:0;text-align:center;padding:9px 6px;border-radius:15px;background:#f8fafc;border:1px solid #e1eaf5}.counter-card.plays{color:#1d4ed8}.counter-card.expiry{color:#0f766e}.clock-face{width:min(100%,96px);aspect-ratio:1;margin:9px auto 10px;border-radius:50%;position:relative;border:3px solid #334155;background:radial-gradient(circle at center,#fff 0 2px,transparent 2.5px),#fff;box-shadow:inset 0 0 0 3px #e2e8f0,0 3px 8px #102a5618}.clock-face:before{content:"";position:absolute;z-index:1;left:calc(50% - 2px);top:19%;width:4px;height:31%;border-radius:4px;background:currentColor;transform-origin:50% 100%;transform:rotate(var(--hand-angle,0deg));box-shadow:0 0 1px #fff}.clock-face:after{content:none}.clock-center{position:absolute;z-index:3;left:calc(50% - 4px);top:calc(50% - 4px);width:8px;height:8px;border-radius:50%;background:#334155;border:2px solid #fff}.clock-number{position:absolute;z-index:0;color:#334155;font-size:9px;font-weight:800;line-height:1;left:50%;top:50%;width:14px;height:12px;text-align:center;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);font-variant-numeric:tabular-nums}.counter-label{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}.counter-value{font-size:18px;font-weight:800;margin:7px 0 4px;line-height:1.15}.counter-sub{font-size:10px;color:#64748b;line-height:1.45;overflow-wrap:anywhere}.counter-track{height:5px;background:#e2e8f0;border-radius:99px;margin-top:10px;overflow:hidden}.counter-fill{height:100%;background:currentColor;border-radius:99px;width:0;transition:width .3s}.tag{display:inline-block;background:#e0edff;color:#174078;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold;margin:0 5px 10px 0}footer{background:white;border-top:1px solid #e0e8f3;padding:22px;text-align:center;color:#718096;font-size:13px;margin-top:30px}@media(max-width:800px){.session-layout{grid-template-columns:1fr}}@media(max-width:800px){.session-layout{grid-template-columns:1fr}.video-frame{min-height:220px}}@media(max-width:420px){main{padding:22px 12px 40px}.panel{padding:15px}h1{font-size:25px}.counter-grid{gap:8px}.clock-face{width:82px}.counter-value{font-size:18px}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://knazqfrjzgkqavnhzjwq.supabase.co';const SUPABASE_KEY='sb_publishable_hkbQPEZcBQ1nq6j9WxIXaA_4wc89YEV';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const statusBox=document.getElementById('status'),content=document.getElementById('content'),playerArea=document.getElementById('playerArea'),accessPanel=document.getElementById('accessPanel');
const videoId=new URLSearchParams(location.search).get('id');let video=null;let paid=false;let player=null;let apiReady=false;
function setMessage(el,text,kind=''){el.textContent=text;el.className=(el===playerArea?'message':'access-message')+(kind?' '+kind:'');}
function youtubeId(url){try{const u=new URL(url);let id='';if(['youtu.be','www.youtu.be'].includes(u.hostname))id=u.pathname.split('/').filter(Boolean)[0]||'';else if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){if(u.pathname==='/watch')id=u.searchParams.get('v')||'';else{const m=u.pathname.match(/^\/(embed|shorts|live)\/([^/?]+)/);if(m)id=m[2]}}return /^[a-zA-Z0-9_-]{11}$/.test(id)?id:''}catch{return ''}}
function addLink(parent,url,label){try{const u=new URL(url);if(!['https:','http:'].includes(u.protocol))return;const a=document.createElement('a');a.className='resource-link';a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=label;parent.appendChild(a)}catch{}}
async function addPdf(){if(!video.pdf_path)return;const b=document.createElement('button');b.className='resource-link';b.textContent='Download session PDF';b.addEventListener('click',async()=>{b.disabled=true;b.textContent='Preparing PDF...';try{const {data,error}=await db.storage.from('preparation-pdfs').createSignedUrl(video.pdf_path,120);if(error)throw error;if(!data?.signedUrl)throw new Error('No download link returned.');window.open(data.signedUrl,'_blank','noopener');b.textContent='Download session PDF'}catch(e){console.error(e);b.textContent='PDF unavailable';alert('Could not create the PDF link. Please contact your teacher.')}finally{b.disabled=false}});document.getElementById('resources').appendChild(b)}
function createPlayer(){const id=youtubeId(video.video_url);if(!id){playerArea.textContent='The video link is invalid. Please contact your teacher.';return}playerArea.replaceChildren();const frame=document.createElement('iframe');frame.id='paid-player';frame.className='video-frame';frame.src='https://www.youtube-nocookie.com/embed/'+id+(paid?'?enablejsapi=1&origin='+encodeURIComponent(location.origin):'');frame.title=video.title||'Session video';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allowFullscreen=true;playerArea.appendChild(frame);if(paid)setupPlayer(frame)}
function setupPlayer(frame){const init=()=>{if(!window.YT?.Player||player)return;try{player=new YT.Player(frame,{events:{onStateChange:async e=>{if(e.data!==YT.PlayerState.ENDED)return;try{const {data,error}=await db.rpc('record_paid_video_completion',{p_video_id:Number(video.id),p_event_token:crypto.randomUUID()});if(error)throw error;if(!data?.success)throw new Error(data?.message||'Completion could not be recorded.');await loadAccess();setMessage(playerArea,'Video completed. Plays remaining: '+data.plays_remaining+'.','success')}catch(err){console.error(err);setMessage(playerArea,'Could not record completion. Please refresh and contact your teacher if this continues.','error')}}}})}catch(e){console.error(e)}};if(window.YT?.Player)init();else{window.onYouTubeIframeAPIReady=init;if(!document.querySelector('script[data-yt-api]')){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.dataset.ytApi='true';document.head.appendChild(s)}}}
function buildAccessForm(message='Enter the access code provided by your teacher.'){accessPanel.hidden=false;accessPanel.replaceChildren();const intro=document.createElement('p');intro.textContent=message;intro.className='description';const label=document.createElement('label');label.textContent='Video access code';const code=document.createElement('input');code.placeholder='Enter access code';code.autocomplete='off';code.setAttribute('aria-label','Video access code');const actions=document.createElement('div');actions.className='actions';const activate=document.createElement('button');activate.textContent='Activate & Watch';actions.appendChild(activate);const renewalLabel=document.createElement('label');renewalLabel.textContent='Renewal code';const renewal=document.createElement('input');renewal.placeholder='Enter renewal code if you have one';renewal.autocomplete='off';renewal.setAttribute('aria-label','Renewal code');const renew=document.createElement('button');renew.className='secondary';renew.textContent='Renew Access';const renewActions=document.createElement('div');renewActions.className='actions';renewActions.appendChild(renew);const msg=document.createElement('p');msg.className='access-message';msg.setAttribute('aria-live','polite');accessPanel.append(intro,label,code,actions,renewalLabel,renew, msg);
activate.addEventListener('click',async()=>{if(!code.value.trim()){setMessage(msg,'Enter your access code.','error');return}activate.disabled=true;setMessage(msg,'Checking your code...');try{const {data,error}=await db.rpc('activate_paid_video_code',{p_video_id:Number(video.id),p_code:code.value.trim()});if(error)throw error;if(!data?.success)throw new Error(data?.message||'This code could not be activated.');await loadAccess();setMessage(msg,'Access activated.','success')}catch(e){console.error(e);setMessage(msg,e.message||'Activation failed. Please check the code and sign-in status.','error')}finally{activate.disabled=false}});
renew.addEventListener('click',async()=>{if(!renewal.value.trim()){setMessage(msg,'Enter your renewal code.','error');return}renew.disabled=true;setMessage(msg,'Checking renewal code...');try{const {data,error}=await db.rpc('redeem_paid_video_renewal_code',{p_video_id:Number(video.id),p_code:renewal.value.trim()});if(error)throw error;if(!data?.success)throw new Error(data?.message||'This renewal code could not be used.');renewal.value='';await loadAccess();setMessage(msg,'Access renewed.','success')}catch(e){console.error(e);setMessage(msg,e.message||'Renewal failed. Please check the code.','error')}finally{renew.disabled=false}})}
function buildNumberedDial(clock,maxValue,currentValue){
  const oldNumbers=clock.querySelectorAll('.clock-number');
  oldNumbers.forEach(n=>n.remove());
  const count=Math.max(1,Math.min(12,Math.floor(Number(maxValue)||1)));
  for(let i=1;i<=count;i++){
    const label=document.createElement('span');
    label.className='clock-number';
    label.textContent=String(Math.max(1,Math.ceil(i/count*(Number(maxValue)||1))));
    const angle=(i/count)*Math.PI*2-Math.PI/2;
    const radius=37;
    label.style.left=(50+Math.cos(angle)*radius)+'%';
    label.style.top=(50+Math.sin(angle)*radius)+'%';
    clock.appendChild(label);
  }
  const value=Math.max(0,Math.min(Number(maxValue)||1,Number(currentValue)||0));
  clock.style.setProperty('--hand-angle',((value/(Number(maxValue)||1))*360)+'deg');
}
async function loadAccess(){const {data,error}=await db.rpc('get_paid_video_access_status',{p_video_id:Number(video.id)});if(error)throw error;const state=data||{};accessPanel.hidden=false;accessPanel.replaceChildren();if(state.has_access===true){const remaining=Math.max(0,Number(state.plays_remaining||0));const allowed=Math.max(1,Number(state.plays_allowed||4));const expiresAt=state.expires_at?new Date(state.expires_at):null;const counterGrid=document.createElement('div');counterGrid.className='counter-grid';const playsCard=document.createElement('div');playsCard.className='counter-card plays';playsCard.innerHTML='<div class="counter-label">Plays left</div><div class="clock-face" id="playsClock" aria-hidden="true"><span class="clock-center"></span></div><div class="counter-value" id="playsCounter"></div><div class="counter-sub" id="playsSub"></div><div class="counter-track"><div class="counter-fill" id="playsFill"></div></div>';playsCard.querySelector('#playsCounter').textContent=remaining+' / '+allowed;playsCard.querySelector('#playsSub').textContent=remaining===1?'1 play remaining':remaining+' plays remaining';playsCard.querySelector('#playsFill').style.width=Math.min(100,remaining/allowed*100)+'%';buildNumberedDial(playsCard.querySelector('#playsClock'),allowed,remaining);const expiryCard=document.createElement('div');expiryCard.className='counter-card expiry';expiryCard.innerHTML='<div class="counter-label">Time remaining</div><div class="clock-face" id="expiryClock" aria-hidden="true"><span class="clock-center"></span></div><div class="counter-value" id="expiryCounter"></div><div class="counter-sub" id="expirySub"></div><div class="counter-track"><div class="counter-fill" id="expiryFill"></div></div>';counterGrid.append(playsCard,expiryCard);accessPanel.appendChild(counterGrid);if(expiresAt&&!Number.isNaN(expiresAt.getTime())){const expiryValue=expiryCard.querySelector('#expiryCounter'),expirySub=expiryCard.querySelector('#expirySub'),expiryFill=expiryCard.querySelector('#expiryFill');const activatedAt=state.activated_at?new Date(state.activated_at):null;const totalMs=activatedAt?Math.max(1,expiresAt-activatedAt):null;const totalDays=totalMs?Math.max(1,Math.ceil(totalMs/86400000)):Math.max(1,Math.ceil((expiresAt-Date.now())/86400000));buildNumberedDial(expiryCard.querySelector('#expiryClock'),totalDays,totalDays);const updateExpiry=()=>{const ms=expiresAt-Date.now();if(ms<=0){expiryValue.textContent='Expired';expirySub.textContent='Renew access to continue';expiryFill.style.width='0%';return}const days=Math.floor(ms/86400000),hours=Math.floor(ms%86400000/3600000),mins=Math.floor(ms%3600000/60000);expiryValue.textContent=days>0?days+'d '+hours+'h':hours>0?hours+'h '+mins+'m':mins+'m';expirySub.textContent='Until '+expiresAt.toLocaleString();expiryFill.style.width=totalMs?Math.max(0,Math.min(100,ms/totalMs*100))+'%':'100%';const daysLeft=Math.max(0,Math.ceil(ms/86400000));buildNumberedDial(expiryCard.querySelector('#expiryClock'),totalDays,daysLeft)};updateExpiry();if(window.expiryTimer)clearInterval(window.expiryTimer);window.expiryTimer=setInterval(updateExpiry,60000)}else{expiryCard.querySelector('#expiryCounter').textContent='Active';expiryCard.querySelector('#expirySub').textContent='No expiry time available';expiryCard.querySelector('#expiryFill').style.width='100%'}if(remaining>0&&!state.expired){createPlayer();const label=document.createElement('label');label.textContent='Renewal code';const input=document.createElement('input');input.placeholder='Enter renewal code if provided';input.autocomplete='off';const btn=document.createElement('button');btn.className='secondary';btn.textContent='Renew Access';const msg=document.createElement('p');msg.className='access-message';msg.setAttribute('aria-live','polite');btn.addEventListener('click',async()=>{if(!input.value.trim()){setMessage(msg,'Enter your renewal code.','error');return}btn.disabled=true;setMessage(msg,'Checking renewal code...');try{const {data,error}=await db.rpc('redeem_paid_video_renewal_code',{p_video_id:Number(video.id),p_code:input.value.trim()});if(error)throw error;if(!data?.success)throw new Error(data?.message||'This renewal code could not be used.');input.value='';await loadAccess();setMessage(msg,'Access renewed.','success')}catch(e){console.error(e);setMessage(msg,e.message||'Renewal failed.','error')}finally{btn.disabled=false}});accessPanel.append(label,input,btn,msg)}else{playerArea.textContent=state.expired?'Your access period has expired. Renew your access to continue.':'You have used all allowed plays. Contact your teacher about renewal.';buildAccessForm(state.expired?'Your access period has expired. Enter a renewal code below, or contact your teacher.':'Your allowed plays have been used. Contact your teacher about your next step.')}}else{playerArea.textContent='Activate your access code to watch this video.';buildAccessForm()}}
async function load(){if(!videoId||!/^\d+$/.test(videoId)){statusBox.textContent='Invalid session link. Please return to the session list.';return}const {data:auth,error:authError}=await db.auth.getSession();if(authError||!auth?.session){statusBox.textContent='Please sign in to your student account first.';return}const {data,error}=await db.from('preparation_videos').select('id,title,category,year_group,description,video_url,practice_url,related_links,pdf_path,created_at').eq('id',Number(videoId)).eq('is_published',true).maybeSingle();if(error||!data){console.error(error);statusBox.textContent='This session could not be found or is not published.';return}video=data;const {data:sessions,error:sError}=await db.from('paid_video_sessions').select('video_id,is_enabled').eq('video_id',Number(videoId)).eq('is_enabled',true);if(sError){console.error(sError);statusBox.textContent='Could not verify session access settings. Please contact your teacher.';return}paid=!!sessions?.length;statusBox.hidden=true;content.hidden=false;document.title=(video.title||'Video Session')+' | IGCSE English Hub';document.getElementById('title').textContent=video.title||'Video Session';document.getElementById('description').textContent=video.description||'';const cat=document.getElementById('category');if(video.category){cat.hidden=false;cat.textContent=video.category}const resources=document.getElementById('resources');if(video.practice_url)addLink(resources,video.practice_url,'Open Related Practice →');if(Array.isArray(video.related_links))video.related_links.forEach(item=>{if(item?.url)addLink(resources,item.url,'Open '+(item.type||'Related resource')+' →')});await addPdf();if(paid){try{await loadAccess()}catch(e){console.error(e);playerArea.textContent='We could not check your access status. Please refresh or contact your teacher.';buildAccessForm('Access status could not be checked. You can try entering your code again.')}}else{accessPanel.hidden=true;createPlayer()}}
load().catch(e=>{console.error(e);statusBox.hidden=false;statusBox.textContent='An unexpected error occurred while loading this session.'});
</script></body></html>
